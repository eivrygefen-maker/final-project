<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1e2128;
      --panel: #2a2d35;
      --fretboard: #3d2817;
      --fretboard-edge: #1a1008;
      --string: #c8c2b8;
      --fret-line: #d4cfc4;
      --nut: #f0ebe3;
      --fret-marker: rgba(255, 255, 255, 0.22);
      --fret-marker-dot: rgba(255, 255, 255, 0.55);
      --cell-hover: rgba(255, 75, 75, 0.28);
      --cell-active: rgba(255, 75, 75, 0.55);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #ff4b4b;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .wrap {
      padding: 12px 16px 16px;
      max-width: 100%;
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .header h2 {
      margin: 0;
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.1;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .status.ready { color: #86efac; }
    .status.stale { color: #fcd34d; }
    .status.building { color: #93c5fd; }
    .now-playing {
      min-height: 1.4em;
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .now-playing strong { color: var(--text); }
    .guitar-shell {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .headstock {
      flex: 0 0 36px;
      background: linear-gradient(90deg, #2f2118 0%, #4a3728 100%);
      border-left: 2px solid var(--fretboard-edge);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    .neck-scroll {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--fretboard-edge);
    }
    .bridge-side {
      flex: 0 0 52px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #e5e7eb;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #14161a 0%, #2f333c 55%, #3d424d 100%);
      border-right: 3px solid #6b7280;
      box-shadow: inset -4px 0 10px rgba(0, 0, 0, 0.35);
    }
    .bridge-bar {
      height: 14px;
      background: linear-gradient(180deg, #4b5563 0%, #9ca3af 45%, #6b7280 100%);
      border-top: 2px solid #d1d5db;
      border-bottom: 1px solid #1f2937;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .bridge-bar::after {
      content: "";
      position: absolute;
      left: 52px;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: linear-gradient(90deg, #78716c 0%, #e7e5e4 50%, #78716c 100%);
      border-radius: 2px;
    }
    .neck {
      position: relative;
      flex: 1 1 auto;
      min-width: min(100%, 720px);
      background: linear-gradient(180deg, #4a3220 0%, var(--fretboard) 18%, var(--fretboard) 82%, #4a3220 100%);
      padding: 10px 6px 12px 8px;
    }
    .orientation-legend {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .orientation-legend strong { color: #f3f4f6; font-weight: 600; }
    .fretboard-grid-cols {
      grid-template-columns: 44px repeat(calc(var(--fret-cols, 20) - 1), minmax(30px, 1fr)) minmax(76px, 96px);
    }
    .fret-labels {
      display: grid;
      gap: 0;
      margin-bottom: 4px;
      padding-right: 4px;
    }
    .fret-labels.open-header span.open-col-header {
      font-weight: 700;
      color: #ffe8a8;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(255, 232, 168, 0.22);
      border-radius: 4px 4px 0 0;
      padding: 3px 0;
      border: 1px solid rgba(255, 232, 168, 0.35);
    }
    .fret-labels span {
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      user-select: none;
    }
    .fret-labels .corner { visibility: hidden; }
    .strings {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .string-row {
      display: grid;
      align-items: center;
      position: relative;
      height: 44px;
    }
    .string-row::after {
      content: "";
      position: absolute;
      left: 44px;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, #6b6560 0%, #f5f0e8 42%, #fffaf5 50%, #f5f0e8 58%, #6b6560 100%);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.65), 0 1px 3px rgba(255, 255, 255, 0.18);
      pointer-events: none;
      z-index: 3;
    }
    .string-row[data-string="1"]::after { height: 1.3px; opacity: 0.92; }
    .string-row[data-string="2"]::after { height: 1.5px; }
    .string-row[data-string="3"]::after { height: 1.7px; }
    .string-row[data-string="4"]::after { height: 1.9px; }
    .string-row[data-string="5"]::after { height: 2.1px; }
    .string-row[data-string="6"]::after { height: 2.6px; }
    .open-zone-strip {
      position: absolute;
      top: 0;
      right: 4px;
      width: min(96px, 20%);
      bottom: 0;
      background: linear-gradient(90deg, rgba(255, 232, 168, 0.06) 0%, rgba(255, 232, 168, 0.20) 100%);
      border-left: 3px dashed rgba(255, 232, 168, 0.55);
      border-right: 6px solid #fff8f0;
      pointer-events: none;
      z-index: 0;
      border-radius: 0 3px 3px 0;
    }
    .open-zone-strip::before {
      content: "OPEN";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-90deg);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: rgba(255, 232, 168, 0.28);
      pointer-events: none;
    }
    .string-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      user-select: none;
      z-index: 2;
    }
    .fret-cell {
      position: relative;
      height: 100%;
      cursor: pointer;
      z-index: 4;
      border-left: 2px solid var(--fret-line);
      background: rgba(0, 0, 0, 0.04);
    }
    .fret-cell.open-cell {
      border-left: 3px dashed rgba(255, 232, 168, 0.65);
      border-right: none;
      min-width: 76px;
      background: rgba(255, 232, 168, 0.14);
    }
    .fret-cell.open-cell:hover { background: rgba(255, 120, 80, 0.28); }
    .open-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff8f0;
      letter-spacing: 0.03em;
      pointer-events: none;
      z-index: 3;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      line-height: 1.15;
    }
    .open-label .open-tag {
      font-size: 0.58rem;
      font-weight: 700;
      color: #ffe8a8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .open-string-hit {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      cursor: pointer;
      z-index: 4;
    }
    .fret-cell:hover { background: var(--cell-hover); }
    .fret-cell.active {
      background: var(--cell-active);
      transition: background 0.08s ease-out;
    }
    .fret-cell.disabled {
      cursor: default;
      opacity: 0.35;
    }
    .fret-markers {
      position: absolute;
      left: 44px;
      right: 4px;
      top: 0;
      bottom: 0;
      pointer-events: none;
      display: grid;
      z-index: 0;
    }
    .fret-marker-slot {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fret-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--fret-marker-dot);
      opacity: 0;
    }
    .fret-marker-slot.inlay .fret-dot { opacity: 1; }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }
    button.secondary {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
    }
    button.secondary:hover:not(:disabled) {
      border-color: var(--accent);
      color: #fff;
    }
    button.secondary:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .idle {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.025);
    }
    .idle.loading {
      color: #bfdbfe;
      border-color: rgba(147, 197, 253, 0.35);
      background: rgba(59, 130, 246, 0.08);
    }
    .preload-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .preload-bar.visible { display: block; }
    .preload-bar > div {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.15s ease;
    }
    .library-panel {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .library-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
    }
    .library-section h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #f9fafb;
    }
    .chord-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .library-button,
    .library-select {
      font-family: inherit;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--panel);
      color: var(--text);
      font-size: 0.86rem;
    }
    .library-button {
      padding: 7px 11px;
      cursor: pointer;
    }
    .library-button:hover:not(:disabled) {
      border-color: var(--accent);
      color: #fff;
    }
    .library-button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .library-select {
      width: 100%;
      padding: 7px 9px;
      margin-bottom: 8px;
    }
    .melody-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .library-now {
      min-height: 1.3em;
      color: var(--muted);
      font-size: 0.86rem;
    }
    @media (max-width: 760px) {
      .library-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h2>Guitar Player</h2>
    </div>
    <div id="nowPlaying" class="now-playing"></div>
    <p id="orientationLegend" class="orientation-legend" hidden>
      <strong>Top</strong> = low E string &nbsp;·&nbsp;
      <strong>Right</strong> = open strings &nbsp;·&nbsp;
      <strong>Left</strong> = higher frets
    </p>
    <div id="idlePanel" class="idle" hidden>
      Click <strong>Generate sound</strong> after Save &amp; Sync to build the note cache and open the interactive fretboard.
    </div>
    <div id="playerPanel" hidden>
      <div class="guitar-shell">
        <div class="neck-scroll">
          <div class="bridge-side" title="Bridge — strings terminate here">Bridge</div>
          <div class="neck" id="neck">
            <div class="fret-labels" id="fretLabels"></div>
            <div class="strings" id="strings"></div>
          </div>
          <div class="headstock" aria-hidden="true"></div>
        </div>
        <div class="bridge-bar" title="Bridge saddle"></div>
      </div>
      <div class="preload-bar" id="preloadBar"><div id="preloadFill"></div></div>
      <div class="library-panel" id="libraryPanel" hidden>
        <div class="library-grid">
          <section class="library-section" aria-label="Chord library">
            <h3>Chords</h3>
            <div class="chord-buttons" id="chordButtons"></div>
          </section>
          <section class="library-section" aria-label="Melody library">
            <h3>Melodies</h3>
            <select class="library-select" id="melodySelect"></select>
            <div class="melody-actions">
              <button class="library-button" id="btnPlayMelody" type="button">Play Selected Melody</button>
              <button class="library-button" id="btnRandomMelody" type="button">Play Random Melody</button>
            </div>
            <div class="library-now" id="libraryNow"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <script src="./streamlit_bridge.js"></script>
  <!-- OVERLAPPING_PLAYBACK_ENABLED: each note click uses new Audio() for chord overlap -->
  <script>
    (function () {
      "use strict";

      /* Low E (6) at top; nut / open strings on the right. */
      var STRING_NUMBERS = [6, 5, 4, 3, 2, 1];

      /* Overlapping playback — each click starts a new Audio(); prior notes keep decaying. */
      var OVERLAPPING_PLAYBACK_ENABLED = true;
      var enable_overlapping_playback = true;
      var MAX_OVERLAPPING_VOICES = 24;
      // OVERLAP_DUCKING_ENABLED: duck older voices when a new note starts.
      var OVERLAP_DUCKING_ENABLED = true;
      var DUCK_TARGET_VOLUME = 0.32;
      var DUCK_FADE_MS = 220;

      var audioCtx = null;
      var buffers = {};
      var loadedWavs = {};
      var previewBuffer = null;
      var activeHtmlAudios = [];
      var overlappingPlayback = true;
      var currentFingerprint = "";
      var currentPayloadKey = "";
      var currentLookup = {};
      var currentLibraryKey = "";
      var currentMelodyId = "";
      var lastRandomMelodyId = "";
      var melodyTimers = [];
      var lastCell = null;
      var resizeRaf = 0;

      function ensureAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function payloadKey(player) {
        return String(player.fingerprint || "") + "|" + String(player.status || "");
      }

      function assetUrl(fingerprint, wavFile) {
        return "./runtime_cache/" + encodeURIComponent(fingerprint) + "/" + encodeURIComponent(wavFile);
      }

      function decodeArrayBuffer(buf) {
        return ensureAudioContext().decodeAudioData(buf.slice(0));
      }

      function fetchWav(url) {
        return fetch(url).then(function (res) {
          if (!res.ok) throw new Error("fetch failed " + url);
          return res.arrayBuffer();
        });
      }

      function preloadNotes(player, onProgress) {
        var fp = player.fingerprint;
        var unique = {};
        (player.positions || []).forEach(function (p) {
          if (p.wav) unique[p.wav] = true;
        });
        var files = Object.keys(unique);
        var done = 0;
        buffers = {};
        loadedWavs = {};
        previewBuffer = null;

        if (!files.length) return Promise.resolve();

        return files.reduce(function (chain, wav) {
          return chain.then(function () {
            return fetchWav(assetUrl(fp, wav))
              .then(decodeArrayBuffer)
              .then(function (decoded) {
                buffers[wav] = decoded;
                loadedWavs[wav] = true;
                done += 1;
                if (onProgress) onProgress(done / files.length);
              });
          });
        }, Promise.resolve()).then(function () {
          var previewUrl = assetUrl(fp, "all_notes_preview.wav");
          return fetchWav(previewUrl)
            .then(decodeArrayBuffer)
            .then(function (decoded) {
              previewBuffer = decoded;
              loadedWavs["all_notes_preview.wav"] = true;
            })
            .catch(function () {
              previewBuffer = null;
            });
        });
      }

      function stopAllPlayback() {
        activeHtmlAudios.forEach(function (audio) {
          try {
            audio.pause();
          } catch (e) { /* ignore */ }
          audio.src = "";
        });
        activeHtmlAudios = [];
      }

      function pruneActiveAudios() {
        while (activeHtmlAudios.length > MAX_OVERLAPPING_VOICES) {
          var oldest = activeHtmlAudios.shift();
          if (!oldest) break;
          try {
            oldest.pause();
          } catch (e) { /* ignore */ }
          oldest.src = "";
        }
      }

      /** Fade older overlapping voices down so chords stay audible without full buildup. */
      // OVERLAP_DUCKING_ENABLED
      function duckActiveNotes(exceptAudio) {
        if (!OVERLAP_DUCKING_ENABLED || !overlappingPlayback) return;
        activeHtmlAudios.forEach(function (audio) {
          if (audio === exceptAudio) return;
          var startVol = typeof audio.volume === "number" ? audio.volume : 1.0;
          var target = DUCK_TARGET_VOLUME;
          var t0 = performance.now();
          function step(now) {
            var p = Math.min(1, (now - t0) / DUCK_FADE_MS);
            audio.volume = startVol + (target - startVol) * p;
            if (p < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        });
      }

      /** Play one note via a fresh HTMLAudioElement (overlapping / chord-friendly). */
      // OVERLAPPING_PLAYBACK_ENABLED
      function playNoteWav(wavFile, volume) {
        if (!wavFile || !currentFingerprint) return;
        if (!overlappingPlayback) {
          stopAllPlayback();
        }
        var url = assetUrl(currentFingerprint, wavFile);
        var audio = new Audio(url);
        duckActiveNotes(audio);
        var v = typeof volume === "number" ? volume : 1.0;
        audio.volume = Math.max(0, Math.min(1, v));
        activeHtmlAudios.push(audio);
        pruneActiveAudios();
        audio.addEventListener("ended", function () {
          var idx = activeHtmlAudios.indexOf(audio);
          if (idx >= 0) activeHtmlAudios.splice(idx, 1);
        });
        audio.play().catch(function (err) {
          console.warn("note play failed", wavFile, err);
        });
        return audio;
      }

      function playPosition(stringNumber, fret, velocity) {
        var key = String(stringNumber) + ":" + String(fret);
        var p = currentLookup[key];
        if (!p || !p.wav || !loadedWavs[p.wav]) return null;
        var audio = playNoteWav(p.wav, velocity);
        setNowPlaying("<strong>S" + p.string + " F" + p.fret + " Â· " + (p.note_name || p.note_id) + "</strong>");
        return audio;
      }

      function stopMelodySequence() {
        melodyTimers.forEach(function (timer) {
          window.clearTimeout(timer);
        });
        melodyTimers = [];
      }

      function playPreviewWav() {
        if (!currentFingerprint) return;
        var previewName = "all_notes_preview.wav";
        if (!loadedWavs[previewName] && !previewBuffer) return;
        playNoteWav(previewName);
      }

      function highlightCell(cell) {
        if (lastCell) lastCell.classList.remove("active");
        lastCell = cell;
        if (cell) {
          cell.classList.add("active");
          window.setTimeout(function () {
            if (lastCell === cell) cell.classList.remove("active");
          }, 220);
        }
      }

      function setStatus(text, cls) {
        var el = document.getElementById("statusBadge");
        if (!el) return;
        el.textContent = text;
        el.className = "status " + (cls || "");
      }

      function setNowPlaying(text) {
        document.getElementById("nowPlaying").innerHTML = text || "";
      }

      function updateFrameHeight() {
        if (!window.Streamlit) return;
        var wrap = document.querySelector(".wrap");
        if (!wrap) return;
        var rect = wrap.getBoundingClientRect();
        var height = Math.ceil(
          Math.max(
            wrap.scrollHeight,
            rect ? rect.height : 0,
            120
          )
        );
        window.Streamlit.setFrameHeight(height + 4);
      }

      function scheduleFrameHeightUpdate() {
        if (resizeRaf) window.cancelAnimationFrame(resizeRaf);
        resizeRaf = window.requestAnimationFrame(function () {
          resizeRaf = 0;
          updateFrameHeight();
        });
      }

      function resolveStringOrder(player) {
        if (player.string_visual_order_numbers && player.string_visual_order_numbers.length) {
          return player.string_visual_order_numbers.slice();
        }
        if (player.fretboard && player.fretboard.string_visual_order_numbers) {
          return player.fretboard.string_visual_order_numbers.slice();
        }
        return [6, 5, 4, 3, 2, 1];
      }

      function displayFretOrder(fretCount, player) {
        var higherLeft = true;
        if (player && player.fretboard && player.fretboard.higher_frets_direction === "right") {
          higherLeft = false;
        }
        var order = [];
        if (higherLeft) {
          for (var f = fretCount; f >= 0; f--) order.push(f);
        } else {
          for (var f = 0; f <= fretCount; f++) order.push(f);
        }
        return order;
      }

      function attachNoteClick(el, lookup) {
        el.addEventListener("click", function (ev) {
          var c = ev.currentTarget;
          var key = c.dataset.string + ":" + c.dataset.fret;
          var p = lookup[key];
          if (!p || !p.wav || !loadedWavs[p.wav]) return;
          playNoteWav(p.wav);
          var cell = c.classList && c.classList.contains("fret-cell")
            ? c
            : (c.closest ? c.closest(".fret-cell") : null);
          highlightCell(cell || c);
          setNowPlaying("<strong>S" + p.string + " F" + p.fret + " · " + (p.note_name || p.note_id) + "</strong>");
        });
      }

      function buildFretboard(player) {
        var fretCount = Number(player.fret_count) || 19;
        STRING_NUMBERS = resolveStringOrder(player);
        var cols = fretCount + 1;
        var fretsDisplay = displayFretOrder(fretCount, player);
        document.documentElement.style.setProperty("--fret-cols", String(cols));

        var lookup = {};
        (player.positions || []).forEach(function (p) {
          lookup[String(p.string) + ":" + String(p.fret)] = p;
        });
        currentLookup = lookup;

        var neckEl = document.getElementById("neck");
        var oldStrip = neckEl.querySelector(".open-zone-strip");
        if (oldStrip) oldStrip.remove();

        var fretLabels = document.getElementById("fretLabels");
        fretLabels.innerHTML = "";
        fretLabels.className = "fret-labels fretboard-grid-cols open-header";
        var corner = document.createElement("span");
        corner.className = "corner";
        corner.textContent = " ";
        fretLabels.appendChild(corner);
        fretsDisplay.forEach(function (f) {
          var fl = document.createElement("span");
          if (f === 0) {
            fl.className = "open-col-header";
            fl.textContent = "Open string";
          } else {
            fl.textContent = String(f);
          }
          fretLabels.appendChild(fl);
        });

        var openStrip = document.createElement("div");
        openStrip.className = "open-zone-strip";
        openStrip.title = "Open strings — click to play";
        neckEl.appendChild(openStrip);

        var stringsEl = document.getElementById("strings");
        stringsEl.innerHTML = "";

        STRING_NUMBERS.forEach(function (sn) {
          var row = document.createElement("div");
          row.className = "string-row fretboard-grid-cols";
          row.dataset.string = String(sn);

          var label = document.createElement("div");
          label.className = "string-label";
          label.textContent = "S" + sn;
          row.appendChild(label);

          fretsDisplay.forEach(function (fret) {
            var cell = document.createElement("div");
            cell.className = "fret-cell";
            cell.dataset.string = String(sn);
            cell.dataset.fret = String(fret);
            var pos = lookup[String(sn) + ":" + String(fret)];
            if (!pos) {
              cell.classList.add("disabled");
            } else {
              cell.title = "S" + sn + " fret " + fret + " · " + (pos.note_name || pos.note_id);
              if (fret === 0) {
                cell.classList.add("open-cell");
                var openLbl = document.createElement("span");
                openLbl.className = "open-label";
                openLbl.innerHTML =
                  '<span class="open-tag">Open</span><span>' + (pos.note_name || pos.note_id) + "</span>";
                cell.appendChild(openLbl);
                var openHit = document.createElement("div");
                openHit.className = "open-string-hit";
                openHit.title = "Open S" + sn + " · " + (pos.note_name || pos.note_id);
                attachNoteClick(openHit, lookup);
                openHit.dataset.string = String(sn);
                openHit.dataset.fret = "0";
                cell.appendChild(openHit);
              }
              attachNoteClick(cell, lookup);
            }
            row.appendChild(cell);
          });
          stringsEl.appendChild(row);
        });
      }

      function showIdle(message, cls) {
        var idle = document.getElementById("idlePanel");
        stopMelodySequence();
        idle.hidden = false;
        idle.className = "idle" + (cls ? " " + cls : "");
        document.getElementById("playerPanel").hidden = true;
        document.getElementById("libraryPanel").hidden = true;
        document.getElementById("orientationLegend").hidden = true;
        idle.textContent = message || "Click Generate sound after Save & Sync to build the note cache and open the interactive fretboard.";
        setNowPlaying("");
        scheduleFrameHeightUpdate();
      }

      function showPlayer() {
        var idle = document.getElementById("idlePanel");
        idle.hidden = true;
        idle.className = "idle";
        document.getElementById("playerPanel").hidden = false;
        document.getElementById("orientationLegend").hidden = false;
        scheduleFrameHeightUpdate();
      }

      function playablePosition(stringNumber, fret) {
        var p = currentLookup[String(stringNumber) + ":" + String(fret)];
        return !!(p && p.wav && loadedWavs[p.wav]);
      }

      function playChord(chord, defaults) {
        if (!chord || !chord.fingering || !chord.default_strum) return;
        var strings = (chord.default_strum.strings || []).slice();
        if (chord.default_strum.direction === "up") {
          strings.reverse();
        }
        var gap = Number(defaults.inter_string_gap_ms);
        if (!Number.isFinite(gap)) gap = 18;
        var velocity = Number(defaults.velocity);
        if (!Number.isFinite(velocity)) velocity = 0.78;
        strings.forEach(function (sn, index) {
          var fret = Number(chord.fingering["string_" + sn]);
          if (fret < 0) return;
          window.setTimeout(function () {
            playPosition(sn, fret, velocity);
          }, index * gap);
        });
        setNowPlaying("<strong>" + (chord.symbol || chord.name || "Chord") + "</strong>");
      }

      function playMelody(melody) {
        if (!melody || !melody.events) return;
        stopMelodySequence();
        var beatMs = 60000 / Math.max(1, Number(melody.tempo_bpm) || 90);
        currentMelodyId = String(melody.id || "");
        var title = melody.title || currentMelodyId || "Melody";
        document.getElementById("libraryNow").textContent = "Playing: " + title;
        setNowPlaying("<strong>" + title + "</strong>");
        melody.events.forEach(function (event) {
          var timer = window.setTimeout(function () {
            var note = event[0];
            var sn = event[1];
            var fret = event[2];
            var velocity = Number(event[5]);
            playPosition(sn, fret, Number.isFinite(velocity) ? velocity : 0.78);
            setNowPlaying("<strong>" + title + " Â· " + note + "</strong>");
          }, Math.max(0, Number(event[3]) || 0) * beatMs);
          melodyTimers.push(timer);
        });
        var endBeat = melody.events.reduce(function (maxBeat, event) {
          return Math.max(maxBeat, (Number(event[3]) || 0) + (Number(event[4]) || 0));
        }, 0);
        melodyTimers.push(window.setTimeout(function () {
          document.getElementById("libraryNow").textContent = "Last played: " + title;
          melodyTimers = [];
        }, endBeat * beatMs + 120));
      }

      function selectRandomMelody(melodies) {
        if (!melodies.length) return null;
        var pool = melodies;
        if (melodies.length > 1 && lastRandomMelodyId) {
          pool = melodies.filter(function (m) {
            return String(m.id || "") !== lastRandomMelodyId;
          });
        }
        var chosen = pool[Math.floor(Math.random() * pool.length)] || melodies[0];
        lastRandomMelodyId = String(chosen.id || "");
        return chosen;
      }

      function renderLibrary(player, library) {
        var panel = document.getElementById("libraryPanel");
        var chordButtons = document.getElementById("chordButtons");
        var melodySelect = document.getElementById("melodySelect");
        var btnPlayMelody = document.getElementById("btnPlayMelody");
        var btnRandomMelody = document.getElementById("btnRandomMelody");
        if (!library || library.status !== "ready") {
          panel.hidden = true;
          return;
        }
        var chordsDoc = library.chords || {};
        var melodiesDoc = library.melodies || {};
        var chords = chordsDoc.chords || [];
        var melodies = melodiesDoc.melodies || [];
        var libKey = String(player.fingerprint || "") + "|" + String(chordsDoc.library_id || "") + "|" + String(melodiesDoc.library_id || "");
        panel.hidden = false;
        if (libKey !== currentLibraryKey) {
          currentLibraryKey = libKey;
          chordButtons.innerHTML = "";
          melodySelect.innerHTML = "";
          chords.forEach(function (chord) {
            var button = document.createElement("button");
            button.type = "button";
            button.className = "library-button";
            button.textContent = chord.symbol || chord.name || chord.id;
            button.title = chord.name || chord.id;
            button.addEventListener("click", function () {
              playChord(chord, chordsDoc.playback_defaults || {});
            });
            chordButtons.appendChild(button);
          });
          melodies.forEach(function (melody) {
            var option = document.createElement("option");
            option.value = String(melody.id || "");
            option.textContent = melody.title || melody.id;
            melodySelect.appendChild(option);
          });
          currentMelodyId = melodies.length ? String(melodies[0].id || "") : "";
          document.getElementById("libraryNow").textContent = "";
        }
        btnPlayMelody.disabled = !melodies.length;
        btnRandomMelody.disabled = !melodies.length;
        btnPlayMelody.onclick = function () {
          var id = melodySelect.value || currentMelodyId;
          var melody = melodies.find(function (m) { return String(m.id || "") === id; }) || melodies[0];
          if (melody) {
            currentMelodyId = String(melody.id || "");
            playMelody(melody);
          }
        };
        btnRandomMelody.onclick = function () {
          var melody = selectRandomMelody(melodies);
          if (melody) {
            currentMelodyId = String(melody.id || "");
            melodySelect.value = currentMelodyId;
            playMelody(melody);
          }
        };
      }

      function renderPlayer(player, library) {
        var status = String(player.status || "hidden").toLowerCase();
        var btnPreview = document.getElementById("btnPreview");

        if (status === "hidden" || status === "missing") {
          setStatus("Waiting for Generate sound", "");
          showIdle(null);
          return;
        }
        if (status === "stale") {
          setStatus("Cache stale — regenerate sound", "stale");
          showIdle("Guitar design changed. Click Generate sound to rebuild the note cache.");
          return;
        }
        if (status === "building") {
          setStatus("Building note cache…", "building");
          showIdle("Building note cache…");
          return;
        }

        if (status !== "ready" || !player.fingerprint) {
          setStatus("Unavailable", "");
          showIdle(null);
          return;
        }

        var key = payloadKey(player);
        currentFingerprint = String(player.fingerprint || "");
        overlappingPlayback = OVERLAPPING_PLAYBACK_ENABLED && player.enable_overlapping_playback !== false;
        enable_overlapping_playback = overlappingPlayback;
        showPlayer();
        setStatus("", "ready");
        buildFretboard(player);

        if (btnPreview) btnPreview.disabled = true;
        var bar = document.getElementById("preloadBar");
        var fill = document.getElementById("preloadFill");
        bar.classList.add("visible");
        fill.style.width = "0%";

        if (key !== currentPayloadKey) {
          currentPayloadKey = key;
          preloadNotes(player, function (frac) {
            fill.style.width = Math.round(frac * 100) + "%";
          }).then(function () {
            bar.classList.remove("visible");
            if (btnPreview) btnPreview.disabled = !(previewBuffer || loadedWavs["all_notes_preview.wav"]);
            scheduleFrameHeightUpdate();
          }).catch(function (err) {
            console.error("preload failed", err);
            setStatus("Audio preload failed", "stale");
            bar.classList.remove("visible");
            scheduleFrameHeightUpdate();
          });
        } else {
          bar.classList.remove("visible");
          if (btnPreview) btnPreview.disabled = !(previewBuffer || loadedWavs["all_notes_preview.wav"]);
          scheduleFrameHeightUpdate();
        }

        if (btnPreview) {
          btnPreview.onclick = function () {
            playPreviewWav();
            setNowPlaying("<strong>All notes preview</strong>");
          };
        }
        renderLibrary(player, library);
      }

      function onRender(event) {
        var args = (event.detail && event.detail.args) || {};
        var player = args.player || { status: "hidden" };
        var library = args.library || { status: "missing" };
        renderPlayer(player, library);
        scheduleFrameHeightUpdate();
      }

      if (window.Streamlit && window.Streamlit.events) {
        window.Streamlit.events.addEventListener(window.Streamlit.RENDER_EVENT, onRender);
      }
      window.addEventListener("resize", scheduleFrameHeightUpdate, { passive: true });
      if (window.ResizeObserver) {
        var observer = new ResizeObserver(scheduleFrameHeightUpdate);
        var observedWrap = document.querySelector(".wrap");
        if (observedWrap) observer.observe(observedWrap);
      }
    })();
  </script>
</body>
</html>
