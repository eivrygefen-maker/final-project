<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1e2128;
      --panel: #2a2d35;
      --fretboard: #3d2817;
      --fretboard-edge: #1a1008;
      --string: #c8c2b8;
      --fret-line: #d4cfc4;
      --nut: #f0ebe3;
      --fret-marker: rgba(255, 255, 255, 0.22);
      --fret-marker-dot: rgba(255, 255, 255, 0.55);
      --cell-hover: rgba(255, 75, 75, 0.28);
      --cell-active: rgba(255, 75, 75, 0.55);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #ff4b4b;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .wrap {
      padding: 12px 16px 16px;
      max-width: 100%;
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .header h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .status.ready { color: #86efac; }
    .status.stale { color: #fcd34d; }
    .status.building { color: #93c5fd; }
    .now-playing {
      min-height: 1.4em;
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .now-playing strong { color: var(--text); }
    .guitar-shell {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .headstock {
      flex: 0 0 36px;
      background: linear-gradient(90deg, #2f2118 0%, #4a3728 100%);
      border-left: 2px solid var(--fretboard-edge);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    .neck-scroll {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--fretboard-edge);
    }
    .bridge-side {
      flex: 0 0 28px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #1a1c22 0%, #2a2d35 100%);
      border-right: 2px solid #4b5563;
    }
    .neck {
      position: relative;
      flex: 1 1 auto;
      min-width: min(100%, 720px);
      background: linear-gradient(180deg, #4a3220 0%, var(--fretboard) 18%, var(--fretboard) 82%, #4a3220 100%);
      padding: 10px 6px 12px 8px;
    }
    .orientation-legend {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .orientation-legend strong { color: #d4cfc4; font-weight: 600; }
    .fretboard-grid-cols {
      grid-template-columns: 44px repeat(calc(var(--fret-cols, 20) - 1), minmax(30px, 1fr)) minmax(68px, 88px);
    }
    .fret-labels {
      display: grid;
      gap: 0;
      margin-bottom: 4px;
      padding-right: 4px;
    }
    .fret-labels.open-header span.open-col-header {
      font-weight: 700;
      color: #f5d78e;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(245, 215, 142, 0.12);
      border-radius: 4px 4px 0 0;
      padding: 2px 0;
    }
    .fret-labels span {
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      user-select: none;
    }
    .fret-labels .corner { visibility: hidden; }
    .strings {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .string-row {
      display: grid;
      align-items: center;
      position: relative;
      height: 40px;
    }
    .open-zone-strip {
      position: absolute;
      top: 0;
      right: 4px;
      width: min(88px, 18%);
      bottom: 0;
      background: linear-gradient(90deg, rgba(245, 215, 142, 0.04) 0%, rgba(245, 215, 142, 0.14) 100%);
      border-left: 2px dashed rgba(245, 215, 142, 0.45);
      border-right: 5px solid var(--nut);
      pointer-events: none;
      z-index: 0;
      border-radius: 0 2px 2px 0;
    }
    .string-line {
      position: absolute;
      left: 44px;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, #8a8478 0%, #f0ebe3 42%, #fff8f0 50%, #f0ebe3 58%, #8a8478 100%);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: 1;
    }
    .string-row[data-string="1"] .string-line { height: 1.2px; opacity: 0.88; }
    .string-row[data-string="2"] .string-line { height: 1.4px; }
    .string-row[data-string="3"] .string-line { height: 1.6px; }
    .string-row[data-string="4"] .string-line { height: 1.8px; }
    .string-row[data-string="5"] .string-line { height: 2px; }
    .string-row[data-string="6"] .string-line { height: 2.4px; }
    .string-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      user-select: none;
      z-index: 2;
    }
    .fret-cell {
      position: relative;
      height: 100%;
      cursor: pointer;
      z-index: 2;
      border-left: 2px solid var(--fret-line);
    }
    .fret-cell.open-cell {
      border-left: 2px dashed rgba(245, 215, 142, 0.55);
      border-right: none;
      min-width: 68px;
      background: rgba(245, 215, 142, 0.10);
    }
    .fret-cell.open-cell:hover { background: rgba(255, 120, 80, 0.28); }
    .open-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      font-size: 0.62rem;
      font-weight: 700;
      color: #f5e6c8;
      letter-spacing: 0.02em;
      pointer-events: none;
      z-index: 3;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      line-height: 1.1;
    }
    .open-label .open-tag {
      font-size: 0.52rem;
      font-weight: 600;
      color: #f5d78e;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .open-string-hit {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      cursor: pointer;
      z-index: 4;
    }
    .fret-cell:hover { background: var(--cell-hover); }
    .fret-cell.active {
      background: var(--cell-active);
      transition: background 0.08s ease-out;
    }
    .fret-cell.disabled {
      cursor: default;
      opacity: 0.35;
    }
    .fret-markers {
      position: absolute;
      left: 44px;
      right: 4px;
      top: 0;
      bottom: 0;
      pointer-events: none;
      display: grid;
      z-index: 0;
    }
    .fret-marker-slot {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fret-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--fret-marker-dot);
      opacity: 0;
    }
    .fret-marker-slot.inlay .fret-dot { opacity: 1; }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }
    button.secondary {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
    }
    button.secondary:hover:not(:disabled) {
      border-color: var(--accent);
      color: #fff;
    }
    button.secondary:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .idle {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
    }
    .preload-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .preload-bar.visible { display: block; }
    .preload-bar > div {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.15s ease;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h2>Guitar Player</h2>
      <span id="statusBadge" class="status">—</span>
    </div>
    <div id="nowPlaying" class="now-playing"></div>
    <p id="orientationLegend" class="orientation-legend" hidden>
      <strong>Top</strong> = low E string &nbsp;·&nbsp;
      <strong>Right</strong> = open strings &nbsp;·&nbsp;
      <strong>Left</strong> = higher frets
    </p>
    <div id="idlePanel" class="idle" hidden>
      Click <strong>Generate sound</strong> after Save &amp; Sync to build the note cache and open the interactive fretboard.
    </div>
    <div id="playerPanel" hidden>
      <div class="guitar-shell">
        <div class="neck-scroll">
          <div class="bridge-side">Bridge</div>
          <div class="neck" id="neck">
            <div class="fret-labels" id="fretLabels"></div>
            <div class="strings" id="strings"></div>
          </div>
          <div class="headstock">Open strings</div>
        </div>
      </div>
      <div class="preload-bar" id="preloadBar"><div id="preloadFill"></div></div>
      <div class="toolbar">
        <button type="button" class="secondary" id="btnPreview" disabled>Play all notes preview</button>
      </div>
    </div>
  </div>
  <script src="./streamlit_bridge.js"></script>
  <script>
    (function () {
      "use strict";

      var INLAY_FRETS = { 3: 1, 5: 1, 7: 1, 9: 1, 12: 2, 15: 1, 17: 1, 19: 1 };
      /* Low E (6) at top; nut / open strings on the right. */
      var STRING_NUMBERS = [6, 5, 4, 3, 2, 1];

      var audioCtx = null;
      var buffers = {};
      var previewBuffer = null;
      var activeSource = null;
      var currentPayloadKey = "";
      var lastCell = null;

      function ensureAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function payloadKey(player) {
        return String(player.fingerprint || "") + "|" + String(player.status || "");
      }

      function assetUrl(fingerprint, wavFile) {
        return "./runtime_cache/" + encodeURIComponent(fingerprint) + "/" + encodeURIComponent(wavFile);
      }

      function decodeArrayBuffer(buf) {
        return ensureAudioContext().decodeAudioData(buf.slice(0));
      }

      function fetchWav(url) {
        return fetch(url).then(function (res) {
          if (!res.ok) throw new Error("fetch failed " + url);
          return res.arrayBuffer();
        });
      }

      function preloadNotes(player, onProgress) {
        var fp = player.fingerprint;
        var unique = {};
        (player.positions || []).forEach(function (p) {
          if (p.wav) unique[p.wav] = true;
        });
        var files = Object.keys(unique);
        var done = 0;
        buffers = {};
        previewBuffer = null;

        if (!files.length) return Promise.resolve();

        return files.reduce(function (chain, wav) {
          return chain.then(function () {
            return fetchWav(assetUrl(fp, wav))
              .then(decodeArrayBuffer)
              .then(function (decoded) {
                buffers[wav] = decoded;
                done += 1;
                if (onProgress) onProgress(done / files.length);
              });
          });
        }, Promise.resolve()).then(function () {
          var previewUrl = assetUrl(fp, "all_notes_preview.wav");
          return fetchWav(previewUrl)
            .then(decodeArrayBuffer)
            .then(function (decoded) {
              previewBuffer = decoded;
            })
            .catch(function () {
              previewBuffer = null;
            });
        });
      }

      function stopActive() {
        if (activeSource) {
          try { activeSource.stop(0); } catch (e) { /* ignore */ }
          activeSource = null;
        }
      }

      function playBuffer(buf) {
        if (!buf) return;
        stopActive();
        var ctx = ensureAudioContext();
        var src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.onended = function () {
          if (activeSource === src) activeSource = null;
        };
        activeSource = src;
        src.start(0);
      }

      function highlightCell(cell) {
        if (lastCell) lastCell.classList.remove("active");
        lastCell = cell;
        if (cell) {
          cell.classList.add("active");
          window.setTimeout(function () {
            if (lastCell === cell) cell.classList.remove("active");
          }, 220);
        }
      }

      function setStatus(text, cls) {
        var el = document.getElementById("statusBadge");
        el.textContent = text;
        el.className = "status " + (cls || "");
      }

      function setNowPlaying(text) {
        document.getElementById("nowPlaying").innerHTML = text || "";
      }

      function displayFretOrder(fretCount) {
        var order = [];
        for (var f = fretCount; f >= 0; f--) order.push(f);
        return order;
      }

      function attachNoteClick(el, lookup) {
        el.addEventListener("click", function (ev) {
          var c = ev.currentTarget;
          var key = c.dataset.string + ":" + c.dataset.fret;
          var p = lookup[key];
          if (!p || !p.wav || !buffers[p.wav]) return;
          playBuffer(buffers[p.wav]);
          var cell = c.classList && c.classList.contains("fret-cell")
            ? c
            : (c.closest ? c.closest(".fret-cell") : null);
          highlightCell(cell || c);
          setNowPlaying("<strong>S" + p.string + " F" + p.fret + " · " + p.note_id + "</strong>");
        });
      }

      function buildFretboard(player) {
        var fretCount = Number(player.fret_count) || 19;
        var cols = fretCount + 1;
        var fretsDisplay = displayFretOrder(fretCount);
        document.documentElement.style.setProperty("--fret-cols", String(cols));

        var lookup = {};
        (player.positions || []).forEach(function (p) {
          lookup[p.string + ":" + p.fret] = p;
        });

        var neckEl = document.getElementById("neck");
        var oldMarkers = neckEl.querySelector(".fret-markers");
        if (oldMarkers) oldMarkers.remove();
        var oldStrip = neckEl.querySelector(".open-zone-strip");
        if (oldStrip) oldStrip.remove();

        var fretLabels = document.getElementById("fretLabels");
        fretLabels.innerHTML = "";
        fretLabels.className = "fret-labels fretboard-grid-cols open-header";
        var corner = document.createElement("span");
        corner.className = "corner";
        corner.textContent = " ";
        fretLabels.appendChild(corner);
        fretsDisplay.forEach(function (f) {
          var fl = document.createElement("span");
          if (f === 0) {
            fl.className = "open-col-header";
            fl.textContent = "Open string";
          } else {
            fl.textContent = String(f);
          }
          fretLabels.appendChild(fl);
        });

        var openStrip = document.createElement("div");
        openStrip.className = "open-zone-strip";
        openStrip.title = "Open strings — click to play";
        neckEl.appendChild(openStrip);

        var stringsEl = document.getElementById("strings");
        stringsEl.innerHTML = "";

        STRING_NUMBERS.forEach(function (sn) {
          var row = document.createElement("div");
          row.className = "string-row fretboard-grid-cols";
          row.dataset.string = String(sn);

          var label = document.createElement("div");
          label.className = "string-label";
          label.textContent = "S" + sn;
          row.appendChild(label);

          var stringLine = document.createElement("div");
          stringLine.className = "string-line";
          row.appendChild(stringLine);

          fretsDisplay.forEach(function (fret) {
            var cell = document.createElement("div");
            cell.className = "fret-cell";
            cell.dataset.string = String(sn);
            cell.dataset.fret = String(fret);
            var pos = lookup[sn + ":" + fret];
            if (!pos) {
              cell.classList.add("disabled");
            } else {
              if (fret === 0) {
                cell.classList.add("open-cell");
                var openLbl = document.createElement("span");
                openLbl.className = "open-label";
                openLbl.innerHTML =
                  '<span class="open-tag">Open</span><span>' + pos.note_id + "</span>";
                cell.appendChild(openLbl);
                var openHit = document.createElement("div");
                openHit.className = "open-string-hit";
                openHit.title = "Open S" + sn + " · " + pos.note_id;
                attachNoteClick(openHit, lookup);
                openHit.dataset.string = String(sn);
                openHit.dataset.fret = "0";
                cell.appendChild(openHit);
              }
              attachNoteClick(cell, lookup);
            }
            row.appendChild(cell);
          });
          stringsEl.appendChild(row);
        });

        var markers = document.createElement("div");
        markers.className = "fret-markers fretboard-grid-cols";
        fretsDisplay.forEach(function (mf) {
          var slot = document.createElement("div");
          slot.className = "fret-marker-slot";
          if (INLAY_FRETS[mf]) {
            slot.classList.add("inlay");
            var dots = INLAY_FRETS[mf];
            if (dots === 2) {
              slot.innerHTML = '<span class="fret-dot" style="margin-right:6px"></span><span class="fret-dot"></span>';
            } else {
              slot.innerHTML = '<span class="fret-dot"></span>';
            }
          }
          markers.appendChild(slot);
        });
        neckEl.appendChild(markers);
      }

      function showIdle(message) {
        document.getElementById("idlePanel").hidden = false;
        document.getElementById("playerPanel").hidden = true;
        document.getElementById("orientationLegend").hidden = true;
        if (message) document.getElementById("idlePanel").textContent = message;
        setNowPlaying("");
      }

      function showPlayer() {
        document.getElementById("idlePanel").hidden = true;
        document.getElementById("playerPanel").hidden = false;
        document.getElementById("orientationLegend").hidden = false;
      }

      function renderPlayer(player) {
        var status = String(player.status || "hidden").toLowerCase();
        var btnPreview = document.getElementById("btnPreview");

        if (status === "hidden" || status === "missing") {
          setStatus("Waiting for Generate sound", "");
          showIdle(null);
          return;
        }
        if (status === "stale") {
          setStatus("Cache stale — regenerate sound", "stale");
          showIdle("Guitar design changed. Click Generate sound to rebuild the note cache.");
          return;
        }
        if (status === "building") {
          setStatus("Building note cache…", "building");
          showIdle("Building note cache…");
          return;
        }

        if (status !== "ready" || !player.fingerprint) {
          setStatus("Unavailable", "");
          showIdle(null);
          return;
        }

        var key = payloadKey(player);
        showPlayer();
        setStatus("Ready · " + (player.unique_note_count || "?") + " notes", "ready");
        buildFretboard(player);

        btnPreview.disabled = true;
        var bar = document.getElementById("preloadBar");
        var fill = document.getElementById("preloadFill");
        bar.classList.add("visible");
        fill.style.width = "0%";

        if (key !== currentPayloadKey) {
          currentPayloadKey = key;
          preloadNotes(player, function (frac) {
            fill.style.width = Math.round(frac * 100) + "%";
          }).then(function () {
            bar.classList.remove("visible");
            btnPreview.disabled = !previewBuffer;
          }).catch(function (err) {
            console.error("preload failed", err);
            setStatus("Audio preload failed", "stale");
            bar.classList.remove("visible");
          });
        } else {
          bar.classList.remove("visible");
          btnPreview.disabled = !previewBuffer;
        }

        btnPreview.onclick = function () {
          if (!previewBuffer) return;
          playBuffer(previewBuffer);
          setNowPlaying("<strong>All notes preview</strong>");
        };
      }

      function onRender(event) {
        var args = (event.detail && event.detail.args) || {};
        var player = args.player || { status: "hidden" };
        renderPlayer(player);
        if (window.Streamlit) {
          window.Streamlit.setFrameHeight(520);
        }
      }

      if (window.Streamlit && window.Streamlit.events) {
        window.Streamlit.events.addEventListener(window.Streamlit.RENDER_EVENT, onRender);
      }
    })();
  </script>
</body>
</html>
