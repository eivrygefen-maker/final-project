<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar Design Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      width: 1000px;
      height: 850px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    :root {
      --st-font: "Source Sans 3", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --st-primary: #ff4b4b;
      --st-primary-hover: #ff2b2b;
      --st-text: #31333f;
      --st-muted: #6b7280;
      --st-border: rgba(49, 51, 63, 0.2);
      --st-panel: rgba(240, 242, 246, 0.85);
      --st-radius: 0.5rem;
      --st-accent-track: #ff4b4b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --st-text: #fafafa;
        --st-muted: #9ca3af;
        --st-border: rgba(250, 250, 250, 0.15);
        --st-panel: rgba(38, 39, 48, 0.9);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      font-family: var(--st-font);
      color: var(--st-text);
      background: #1a1c24;
    }
    .studio {
      display: grid;
      grid-template-columns: minmax(220px, 280px) 1fr;
      gap: 12px;
      height: 850px;
      min-height: 850px;
      padding: 8px 10px 10px;
      position: relative;
    }
    .panel {
      background: var(--st-panel);
      border: 1px solid var(--st-border);
      border-radius: var(--st-radius);
      padding: 12px 14px;
      color: var(--st-text);
    }
    .panel.panel-controls {
      padding-bottom: 32px;
    }
    .panel h3 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .panel .sub {
      margin: 0 0 12px;
      font-size: 0.78rem;
      color: var(--st-muted);
      line-height: 1.35;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin: 10px 0 4px;
    }
    select, input[type="range"] {
      width: 100%;
    }
    select {
      padding: 6px 8px;
      border-radius: var(--st-radius);
      border: 1px solid var(--st-border);
      background-color: #f6f7fb;
      color: #1a1c24;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      appearance: auto;
      -webkit-appearance: menulist;
    }
    select option {
      background-color: #ffffff;
      color: #1a1c24;
    }
    @media (prefers-color-scheme: dark) {
      select {
        background-color: #262730;
        color: #fafafa;
        border-color: rgba(250, 250, 250, 0.2);
      }
      select option {
        background-color: #262730;
        color: #fafafa;
      }
    }
    .val {
      float: right;
      font-weight: 500;
      color: var(--st-muted);
      font-size: 0.75rem;
    }
    input[type="range"] {
      accent-color: var(--st-accent-track);
      height: 4px;
    }
    .view-wrap {
      position: relative;
      border-radius: var(--st-radius);
      border: 1px solid var(--st-border);
      background: linear-gradient(165deg, #e8eaef 0%, #d4d8e0 45%, #c5cad4 100%);
      min-height: 580px;
    }
    #viewport {
      width: 100%;
      height: 100%;
      min-height: 580px;
      display: block;
      border-radius: inherit;
    }
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(0,0,0,0.45);
      color: #fff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--st-border);
    }
    button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: var(--st-radius);
      border: 1px solid var(--st-border);
      cursor: pointer;
      background: transparent;
      color: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    button.primary {
      background: var(--st-primary);
      border-color: var(--st-primary);
      color: #fff;
    }
    button.primary:hover { background: var(--st-primary-hover); border-color: var(--st-primary-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .mode-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      background: rgba(255,75,75,0.15);
      color: var(--st-primary);
      margin-bottom: 8px;
    }
    #errorPanel {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      max-height: 120px;
      overflow: auto;
      margin: 0;
      padding: 8px;
      font-size: 0.7rem;
      background: rgba(120, 0, 0, 0.88);
      color: #fff;
      border-radius: 6px;
      z-index: 10;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
  <div class="studio">
    <aside class="panel panel-controls studio-panel" id="controls">
      <h3>Design Studio</h3>
      <p class="sub">ROM/LHS parameters only — instant Three.js preview. Save &amp; Sync pushes to Gmsh/PyVista.</p>
      <div class="mode-pill" id="modeLabel">User (ROM)</div>

      <label for="shapeSelect">Shape</label>
      <select id="shapeSelect">
        <option value="Classical">Classical (Torres)</option>
        <option value="Dreadnought">Dreadnought (Martin)</option>
        <option value="Box">Box (debug)</option>
      </select>

      <label>Length L (m) <span class="val" id="lengthVal">—</span></label>
      <input type="range" id="length" step="0.005" />

      <label>Width W (m) <span class="val" id="widthVal">—</span></label>
      <input type="range" id="width" step="0.005" />

      <label>Depth D (m) <span class="val" id="depthVal">—</span></label>
      <input type="range" id="depth" step="0.005" />

      <label>Top thickness (m) <span class="val" id="topThicknessVal">—</span></label>
      <input type="range" id="topThickness" step="0.0005" />

      <label>Soundhole radius (m) <span class="val" id="holeVal">—</span></label>
      <input type="range" id="holeRadius" step="0.001" />

      <label for="topWood">Top wood</label>
      <select id="topWood"></select>

      <label for="backWood">Back &amp; sides wood</label>
      <select id="backWood"></select>

      <div class="actions">
        <button type="button" class="primary" id="btnSave">Save &amp; Sync</button>
        <button type="button" id="btnRom">Run ROM Prediction</button>
        <button type="button" id="btnFem" style="display:none">Run Full FEM</button>
      </div>
    </aside>

    <div class="view-wrap">
      <div class="badge">Live 3D · Luthier blueprint</div>
      <canvas id="viewport"></canvas>
      <pre id="errorPanel" hidden aria-live="polite"></pre>
    </div>
    </div>
  </div>
  <!-- Local bridge + Three.js (lib/ — no external CDN; CSP-safe) -->
  <script src="./streamlit_bridge.js"></script>
  <script>
    try {
      document.documentElement.style.width = "1000px";
      document.documentElement.style.height = "850px";
      document.body.style.width = "1000px";
      document.body.style.height = "850px";
      if (window.Streamlit && typeof window.Streamlit.setComponentReady === "function") {
        window.Streamlit.setComponentReady();
        console.log("STARTUP: setComponentReady called");
      }
      if (window.Streamlit && typeof window.Streamlit.setFrameHeight === "function") {
        window.Streamlit.setFrameHeight(850);
        console.log("STARTUP: setFrameHeight(850) called (parent iframe sizing)");
      }
    } catch (e) {
      console.error("FATAL JS ERROR (pre-Three.js ready):", e);
      if (e && e.stack) console.error(e.stack);
      try {
        if (window.Streamlit) window.Streamlit.setComponentReady();
      } catch (_e2) { /* ignore */ }
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three.module.js"
      }
    }
  </script>
  <script type="module" src="./lib/load-three.mjs"></script>
  <script>
  (function () {
    try {
    /* ── Streamlit bridge (./streamlit_bridge.js → Streamlit.* API) ─── */
    let eventsWired = false;
    let lastRomFp = "";
    let lastRenderArgsFp = "";
    let animating = true;

    function logError(msg) {
      const text = String(msg || "unknown error");
      console.error("[Design Studio]", text);
      const panel = document.getElementById("errorPanel");
      if (panel) {
        panel.hidden = false;
        panel.textContent = text.slice(0, 2000);
      }
    }

    window.onerror = function (message, _source, _line, _col, error) {
      logError(message + (error && error.stack ? "\n" + error.stack : ""));
      return false;
    };

    function threeLibsLoaded() {
      return Boolean(
        window.__threeReady &&
        window.THREE &&
        typeof window.THREE.Scene === "function" &&
        typeof window.THREE.OrbitControls === "function"
      );
    }

    /** Run callback once Three.js globals are injected (handles late subscribe + fast load). */
    function whenThreeReady(callback) {
      if (threeLibsLoaded()) {
        callback();
        return;
      }
      window.addEventListener(
        "three-ready",
        function () {
          if (threeLibsLoaded()) callback();
          else logError("three-ready fired but THREE globals are incomplete.");
        },
        { once: true }
      );
      window.addEventListener(
        "three-error",
        function (ev) {
          const msg = (ev && ev.detail && ev.detail.message) || "Three.js module load failed.";
          logError(msg);
        },
        { once: true }
      );
    }

    function setComponentValue(value) {
      if (window.Streamlit && typeof Streamlit.setComponentValue === "function") {
        Streamlit.setComponentValue(value);
      }
    }

  /** Streamlit passes kwargs as args; ROM payload lives under args.initial */
  function normalizeArgs(raw) {
    if (!raw || typeof raw !== "object") return {};
    if (raw.initial && typeof raw.initial === "object") return raw.initial;
    return raw;
  }

    function renderArgsFingerprint(args) {
      const d = normalizeArgs(args);
      return [
        d.shape_type, d.length, d.width, d.depth,
        d.top_thickness, d.hole_radius,
        d.top_wood_id, d.back_wood_id, d.gui_mode,
        Boolean(args && args.templates),
      ].join("|");
    }

    function onRender(event) {
      let args = {};
      if (event && event.detail && event.detail.args) {
        args = event.detail.args;
      } else if (event && event.data && event.data.type === "streamlit:render") {
        args = event.data.args || {};
      }
      const rfp = renderArgsFingerprint(args);
      if (rfp === lastRenderArgsFp && initialized3d) {
        return;
      }
      lastRenderArgsFp = rfp;
      try {
        applyArgs(args);
      } catch (err) {
        logError("applyArgs: " + (err && err.message ? err.message : err));
      }
    }

    function wireStreamlitEvents() {
      if (eventsWired) return;
      eventsWired = true;
      if (window.Streamlit && Streamlit.events) {
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
      }
    }

    try {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", wireStreamlitEvents);
      } else {
        wireStreamlitEvents();
      }
    } catch (err) {
      console.error("[Design Studio] bridge wiring failed:", err);
      if (err && err.stack) console.error(err.stack);
    }

    const ROM_KEYS = [
      "shape_type", "length", "width", "depth",
      "top_thickness", "hole_radius", "top_wood_id", "back_wood_id",
    ];

    function num(v, fallback) {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : fallback;
    }

    /* ── State (7D ROM + metadata only) ─────────────────────────────── */
    const state = {
      shape_type: "Classical",
      length: 0.49,
      width: 0.37,
      depth: 0.095,
      top_thickness: 0.0045,
      hole_radius: 0.045,
      top_wood_id: "spruce",
      back_wood_id: "rosewood",
      gui_mode: "user",
      bounds: { length: [0.35, 0.6], width: [0.2, 0.45], depth: [0.08, 0.15] },
      top_thickness_bounds: [0.003, 0.006],
      hole_radius_bounds: [0.035, 0.055],
      wood_ids: ["spruce", "cedar", "mahogany", "rosewood", "maple"],
      wood_colors: {},
      templates: {},
      soundhole_from_neck_ratio: 0.5,
      bounds_by_shape: {},
    };

    /* Orthotropic plate surface colors (matches gui/app.py STUDIO_WOOD_HEX) */
    const WOOD_COLORS_BUILTIN = {
      spruce: "#F4E7C1",
      cedar: "#A0522D",
      maple: "#FFDEAD",
      mahogany: "#704229",
      rosewood: "#3F2A20",
    };
    state.wood_colors = Object.assign({}, WOOD_COLORS_BUILTIN, state.wood_colors);

    /* Built-in luthier loops (used if Python omits templates on later reruns) */
    const TEMPLATES_BUILTIN = {
      Classical: {
        nominal_length: 0.49,
        nominal_width: 0.37,
        loop: [
          [0.22,0.045],[0.18,0.11],[0.12,0.14],[0.06,0.13],[0,0.115],
          [-0.06,0.135],[-0.12,0.175],[-0.18,0.185],[-0.24,0.14],[-0.26,0.07],
          [-0.27,0],[-0.26,-0.07],[-0.24,-0.14],[-0.18,-0.185],[-0.12,-0.175],
          [-0.06,-0.135],[0,-0.115],[0.06,-0.13],[0.12,-0.14],[0.18,-0.11],[0.22,-0.045]
        ],
      },
      Dreadnought: {
        nominal_length: 0.495,
        nominal_width: 0.41,
        loop: [
          [0.22,0.05],[0.18,0.135],[0.12,0.155],[0.06,0.148],[0,0.14],
          [-0.06,0.165],[-0.12,0.195],[-0.19,0.205],[-0.25,0.16],[-0.27,0.08],
          [-0.275,0],[-0.27,-0.08],[-0.25,-0.16],[-0.19,-0.205],[-0.12,-0.195],
          [-0.06,-0.165],[0,-0.14],[0.06,-0.148],[0.12,-0.155],[0.18,-0.135],[0.22,-0.05]
        ],
      },
    };
    state.templates = Object.assign({}, TEMPLATES_BUILTIN, state.templates);

    let scene, camera, renderer, controls;
    let bodyGroup = null;
    let initialized3d = false;

    function mergeRomState(data) {
      if (!data || typeof data !== "object") return;
      ROM_KEYS.forEach((k) => {
        if (data[k] !== undefined && data[k] !== null) state[k] = data[k];
      });
      if (data.gui_mode) state.gui_mode = data.gui_mode;
      if (data.bounds) state.bounds = data.bounds;
      if (data.bounds_by_shape) state.bounds_by_shape = data.bounds_by_shape;
      if (data.top_thickness_bounds) state.top_thickness_bounds = data.top_thickness_bounds;
      if (data.hole_radius_bounds) state.hole_radius_bounds = data.hole_radius_bounds;
      if (data.wood_ids) state.wood_ids = data.wood_ids;
      if (data.wood_colors) state.wood_colors = Object.assign({}, WOOD_COLORS_BUILTIN, data.wood_colors);
      if (data.templates && typeof data.templates === "object") {
        state.templates = Object.assign({}, state.templates, data.templates);
      }
      if (data.soundhole_from_neck_ratio != null) {
        state.soundhole_from_neck_ratio = num(data.soundhole_from_neck_ratio, 0.5);
      }
      state.length = num(state.length, 0.49);
      state.width = num(state.width, 0.37);
      state.depth = num(state.depth, 0.095);
      state.top_thickness = num(state.top_thickness, 0.0045);
      state.hole_radius = num(state.hole_radius, 0.045);
    }

    function romFingerprint() {
      return [
        state.shape_type,
        num(state.length, 0), num(state.width, 0), num(state.depth, 0),
        num(state.top_thickness, 0), num(state.hole_radius, 0),
        state.top_wood_id, state.back_wood_id,
      ].join("|");
    }

    function soundholeX(L) {
      const ratio = num(state.soundhole_from_neck_ratio, 0.5);
      const len = num(L, 0.49);
      return 0.5 * len - ratio * len;
    }

    function addSoundhole(L, D, tTop) {
      const hr = num(state.hole_radius, 0.045);
      if (hr <= 0.005) return;
      const hx = soundholeX(L);
      const holeGeom = new THREE.CylinderGeometry(hr, hr, Math.max(tTop * 2.2, 0.008), 32);
      const holeMat = new THREE.MeshPhongMaterial({ color: 0x0a0a0a, shininess: 4 });
      const holeMesh = new THREE.Mesh(holeGeom, holeMat);
      holeMesh.position.set(hx, D + tTop * 0.5, 0);
      bodyGroup.add(holeMesh);
    }

    function setupStudioLighting() {
      scene.add(new THREE.AmbientLight(0xffffff, 0.58));
      const hemi = new THREE.HemisphereLight(0xf4f6fa, 0x8a9199, 0.52);
      hemi.position.set(0, 0.85, 0);
      scene.add(hemi);

      const topKey = new THREE.DirectionalLight(0xffffff, 0.46);
      topKey.position.set(0.35, 1.55, 0.75);
      scene.add(topKey);

      const bottomFill = new THREE.DirectionalLight(0xfff0dc, 0.58);
      bottomFill.position.set(0.15, -1.05, -0.55);
      scene.add(bottomFill);

      const frontRim = new THREE.DirectionalLight(0xffffff, 0.38);
      frontRim.position.set(0.05, 0.55, 1.25);
      scene.add(frontRim);

      const backRim = new THREE.DirectionalLight(0xffffff, 0.42);
      backRim.position.set(-0.05, 0.45, -1.25);
      scene.add(backRim);

      const sideLeft = new THREE.DirectionalLight(0xffffff, 0.22);
      sideLeft.position.set(-1.15, 0.25, 0.15);
      scene.add(sideLeft);

      const sideRight = new THREE.DirectionalLight(0xffffff, 0.22);
      sideRight.position.set(1.15, 0.25, 0.15);
      scene.add(sideRight);
    }

    function scaleLoop(loop, L, W, nominalLength, nominalWidth) {
      const sx = num(L, 0.49) / Math.max(num(nominalLength, 0.49), 1e-9);
      const sy = num(W, 0.37) / Math.max(num(nominalWidth, 0.37), 1e-9);
      return loop.map(([x, y]) => [x * sx, y * sy]);
    }

  function woodColorHex(woodId) {
    const key = String(woodId || "").toLowerCase();
    const hex = state.wood_colors && state.wood_colors[key];
    return hexColor(hex || WOOD_COLORS_BUILTIN[key] || "#8B7355");
  }

  function hexColor(hex) {
    const h = String(hex || "#8B7355").replace("#", "");
    if (h.length !== 6) return new THREE.Color(0.55, 0.45, 0.35);
    return new THREE.Color(
      parseInt(h.slice(0, 2), 16) / 255,
      parseInt(h.slice(2, 4), 16) / 255,
      parseInt(h.slice(4, 6), 16) / 255
    );
  }

    function disposeGroup(g) {
      if (!g || !scene) return;
      g.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
          else obj.material.dispose();
        }
      });
      scene.remove(g);
    }

    function buildBody() {
      if (typeof THREE === "undefined" || !scene) return;
      disposeGroup(bodyGroup);
      bodyGroup = new THREE.Group();
      const L = num(state.length, 0.49);
      const W = num(state.width, 0.37);
      const D = num(state.depth, 0.095);
      const tTop = num(state.top_thickness, 0.0045);
    const backCol = woodColorHex(state.back_wood_id);
    const topCol = woodColorHex(state.top_wood_id);
    const matBack = new THREE.MeshPhongMaterial({
      color: backCol,
      shininess: 32,
      specular: 0x222222,
      flatShading: false,
    });
    const matTop = new THREE.MeshPhongMaterial({
      color: topCol,
      shininess: 48,
      specular: 0x333333,
      flatShading: false,
    });

    if (state.shape_type === "Box") {
      const bodyGeom = new THREE.BoxGeometry(L, D, W);
      const bodyMesh = new THREE.Mesh(bodyGeom, matBack);
      bodyMesh.position.set(0, D / 2, 0);
      bodyGroup.add(bodyMesh);

      const topGeom = new THREE.BoxGeometry(L, tTop, W);
      const topMesh = new THREE.Mesh(topGeom, matTop);
      topMesh.position.set(0, D + tTop / 2, 0);
      bodyGroup.add(topMesh);
    } else {
      const tmpl = state.templates[state.shape_type] || state.templates.Classical;
      if (!tmpl || !tmpl.loop || tmpl.loop.length < 3) {
        const geom = new THREE.BoxGeometry(L, D, W * 0.5);
        bodyGroup.add(new THREE.Mesh(geom, matBack));
      } else {
        const pts = scaleLoop(tmpl.loop, L, W, tmpl.nominal_length, tmpl.nominal_width);
        const shape = new THREE.Shape();
        shape.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
        shape.closePath();
        const extrudeSettings = { depth: D, bevelEnabled: false, curveSegments: 1 };
        const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geom.rotateX(-Math.PI / 2);
        geom.translate(0, D, 0);
        const mesh = new THREE.Mesh(geom, matBack);
        bodyGroup.add(mesh);

        const topGeom = new THREE.ExtrudeGeometry(shape, { depth: tTop, bevelEnabled: false });
        topGeom.rotateX(-Math.PI / 2);
        topGeom.translate(0, D, 0);
        const topMesh = new THREE.Mesh(topGeom, matTop);
        bodyGroup.add(topMesh);
      }
    }

      addSoundhole(L, D, tTop);

      const box = new THREE.Box3().setFromObject(bodyGroup);
      const center = box.getCenter(new THREE.Vector3());
      bodyGroup.position.sub(center);
      scene.add(bodyGroup);
      renderFrame();
    }

    function renderFrame() {
      if (!renderer || !scene || !camera) return;
      try {
        if (controls) controls.update();
        renderer.render(scene, camera);
      } catch (err) {
        console.error("[Design Studio] renderFrame:", err);
      }
    }

    function signalReadyAfterCrash(checkpoint) {
      console.error("DEBUG CRASH AT CHECKPOINT " + checkpoint);
      try {
        if (window.Streamlit && typeof window.Streamlit.setComponentReady === "function") {
          window.Streamlit.setComponentReady();
          console.log("STARTUP: setComponentReady called (post-crash checkpoint " + checkpoint + ")");
        }
      } catch (readyErr) {
        console.error("DEBUG: setComponentReady failed after crash:", readyErr);
      }
    }

    /**
     * Synchronous Three.js boot (no await / GLTF / texture loaders).
     * Geometry build is deferred to the next task so the mount handshake is not blocked.
     */
    function initThreeCore() {
      if (initialized3d) return;
      var checkpoint = 0;
      try {
        const canvas = document.getElementById("viewport");
        if (!canvas) throw new Error("viewport canvas not found");
        const wrap = canvas.parentElement;
        const w = Math.max(wrap.clientWidth, 400);
        const h = Math.max(wrap.clientHeight, 560);

        checkpoint = 3;
        console.log("CHECKPOINT 3: Scene setup");
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe8eaef);

        checkpoint = 2;
        console.log("CHECKPOINT 2: Camera setup");
        camera = new THREE.PerspectiveCamera(42, w / h, 0.01, 10);
        camera.position.set(0.35, 0.28, 0.55);

        checkpoint = 1;
        console.log("CHECKPOINT 1: Renderer setup");
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        if (typeof THREE.OrbitControls === "function") {
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
          controls.rotateSpeed = 0.5;
          controls.screenSpacePanning = true;
          controls.target.set(0, 0.05, 0);
          controls.update();
        }

        setupStudioLighting();

        checkpoint = 4;
        console.log("CHECKPOINT 4: Loading geometry...");
        setTimeout(function () {
          var geoCheckpoint = 4;
          try {
            buildBody();
            geoCheckpoint = 5;
            console.log("CHECKPOINT 5: Geometry loaded");
            renderFrame();
            initialized3d = true;
            animate();
            geoCheckpoint = 6;
            console.log("CHECKPOINT 6: Engine fully initialized");
          } catch (geoErr) {
            console.error("DEBUG CRASH AT CHECKPOINT " + geoCheckpoint, geoErr);
            if (geoErr && geoErr.stack) console.error(geoErr.stack);
            signalReadyAfterCrash(geoCheckpoint);
          }
        }, 0);
      } catch (error) {
        console.error("DEBUG CRASH AT CHECKPOINT " + checkpoint, error);
        if (error && error.stack) console.error(error.stack);
        signalReadyAfterCrash(checkpoint);
      }
    }

    function initThree() {
      if (initialized3d) return;
      whenThreeReady(initThreeCore);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!animating) return;
      try {
        if (controls) controls.update();
        if (renderer && scene && camera) renderer.render(scene, camera);
      } catch (err) {
        logError("render loop: " + (err && err.message ? err.message : err));
        animating = false;
      }
    }

    document.addEventListener("visibilitychange", function () {
      animating = !document.hidden;
      if (animating && initialized3d) animate();
    });

    function onResize() {
      if (!renderer || !camera) return;
      const wrap = document.getElementById("viewport").parentElement;
      const w = Math.max(wrap.clientWidth, 400);
      const h = Math.max(wrap.clientHeight, 560);
      if (w < 1 || h < 1) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    /* Resize listener disabled — fixed 1000×850 layout; avoids zero-height collapse */

    function fmt(v, dec) {
      return num(v, 0).toFixed(dec);
    }

    function applySliderBounds() {
      const b = state.bounds || {};
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const setRange = (id, key, fallback) => {
        const el = document.getElementById(id);
        if (!el) return;
        const pair = b[key] || fallback;
        const lo = num(pair[0], fallback[0]);
        const hi = num(pair[1], fallback[1]);
        el.min = lo;
        el.max = hi;
        const cur = num(state[key], lo);
        el.value = clamp(cur, lo, hi);
        state[key] = num(el.value, lo);
      };
      setRange("length", "length", [0.35, 0.6]);
      setRange("width", "width", [0.2, 0.45]);
      setRange("depth", "depth", [0.08, 0.15]);
      const tt = state.top_thickness_bounds || [0.003, 0.006];
      const hr = state.hole_radius_bounds || [0.035, 0.055];
      const tEl = document.getElementById("topThickness");
      if (tEl) {
        tEl.min = num(tt[0], 0.003);
        tEl.max = num(tt[1], 0.006);
        tEl.value = num(state.top_thickness, tEl.min);
        state.top_thickness = num(tEl.value, 0.0045);
      }
      const hEl = document.getElementById("holeRadius");
      if (hEl) {
        hEl.min = num(hr[0], 0.035);
        hEl.max = num(hr[1], 0.055);
        hEl.value = num(state.hole_radius, hEl.min);
        state.hole_radius = num(hEl.value, 0.045);
      }
    }

    function readSliders() {
      state.shape_type = document.getElementById("shapeSelect").value || "Classical";
      state.length = num(document.getElementById("length").value, state.length);
      state.width = num(document.getElementById("width").value, state.width);
      state.depth = num(document.getElementById("depth").value, state.depth);
      state.top_thickness = num(document.getElementById("topThickness").value, state.top_thickness);
      state.hole_radius = num(document.getElementById("holeRadius").value, state.hole_radius);
      state.top_wood_id = document.getElementById("topWood").value || "spruce";
      state.back_wood_id = document.getElementById("backWood").value || "rosewood";
      updateLabels();
    }

  function updateLabels() {
    document.getElementById("lengthVal").textContent = fmt(state.length, 3);
    document.getElementById("widthVal").textContent = fmt(state.width, 3);
    document.getElementById("depthVal").textContent = fmt(state.depth, 3);
    document.getElementById("topThicknessVal").textContent = fmt(state.top_thickness, 4);
    document.getElementById("holeVal").textContent = fmt(state.hole_radius, 3);
  }

  function updateModeUi() {
    const admin = state.gui_mode === "admin";
    document.getElementById("modeLabel").textContent = admin ? "Admin (FEM)" : "User (ROM)";
    document.getElementById("btnRom").style.display = admin ? "none" : "block";
    document.getElementById("btnFem").style.display = admin ? "block" : "none";
  }

    function payload(action) {
      return {
        action,
        _ts: Date.now(),
        shape_type: state.shape_type,
        length: num(state.length, 0.49),
        width: num(state.width, 0.37),
        depth: num(state.depth, 0.095),
        top_thickness: num(state.top_thickness, 0.0045),
        hole_radius: num(state.hole_radius, 0.045),
        top_wood_id: state.top_wood_id,
        back_wood_id: state.back_wood_id,
        gui_mode: state.gui_mode,
      };
    }

    function sync3dFromState() {
      try {
        readSliders();
        if (!initialized3d) {
          initThree();
        } else {
          buildBody();
          renderFrame();
        }
      } catch (err) {
        console.error("[Design Studio] sync3dFromState:", err);
      }
    }

    function refresh3d() {
      sync3dFromState();
      notifyParamChange();
    }

    let paramNotifyTimer = null;
    function notifyParamChange() {
      if (paramNotifyTimer) clearTimeout(paramNotifyTimer);
      paramNotifyTimer = setTimeout(function () {
        readSliders();
        setComponentValue(payload("param_change"));
      }, 350);
    }

  function fillWoodSelects() {
    const top = document.getElementById("topWood");
    const back = document.getElementById("backWood");
    top.innerHTML = "";
    back.innerHTML = "";
    (state.wood_ids || []).forEach((id) => {
      const o1 = document.createElement("option");
      o1.value = id;
      o1.textContent = id.charAt(0).toUpperCase() + id.slice(1);
      top.appendChild(o1);
      const o2 = o1.cloneNode(true);
      back.appendChild(o2);
    });
    top.value = state.top_wood_id;
    back.value = state.back_wood_id;
  }

    function applyArgs(rawArgs) {
      const data = normalizeArgs(rawArgs);
      const hadTemplates = Boolean(data.templates && Object.keys(data.templates).length);
      mergeRomState(data);
      if (!state.bounds && state.bounds_by_shape && state.bounds_by_shape[state.shape_type]) {
        state.bounds = state.bounds_by_shape[state.shape_type];
      }
      const shapeEl = document.getElementById("shapeSelect");
      if (shapeEl && shapeEl.value !== state.shape_type) shapeEl.value = state.shape_type;
      fillWoodSelects();
      applySliderBounds();
      const ids = [
        ["length", state.length],
        ["width", state.width],
        ["depth", state.depth],
        ["topThickness", state.top_thickness],
        ["holeRadius", state.hole_radius],
      ];
      ids.forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el && String(el.value) !== String(val)) el.value = val;
      });
      const tw = document.getElementById("topWood");
      const bw = document.getElementById("backWood");
      if (tw && tw.value !== state.top_wood_id) tw.value = state.top_wood_id;
      if (bw && bw.value !== state.back_wood_id) bw.value = state.back_wood_id;
      updateLabels();
      updateModeUi();
      const fp = romFingerprint();
      if (fp !== lastRomFp || hadTemplates || !initialized3d) {
        lastRomFp = fp;
        sync3dFromState();
      }
    }

    ["length", "width", "depth", "topThickness", "holeRadius"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("input", refresh3d);
    });
    document.getElementById("shapeSelect").addEventListener("change", () => {
      state.shape_type = document.getElementById("shapeSelect").value || "Classical";
      const byShape = state.bounds_by_shape || {};
      if (byShape[state.shape_type]) state.bounds = byShape[state.shape_type];
      applySliderBounds();
      refresh3d();
    });
    document.getElementById("topWood").addEventListener("change", refresh3d);
    document.getElementById("backWood").addEventListener("change", refresh3d);

    document.getElementById("btnSave").addEventListener("click", () => {
      readSliders();
      setComponentValue(payload("save_sync"));
    });
    document.getElementById("btnRom").addEventListener("click", () => {
      readSliders();
      setComponentValue(payload("run_rom"));
    });
    document.getElementById("btnFem").addEventListener("click", () => {
      readSliders();
      setComponentValue(payload("run_fem"));
    });

    applySliderBounds();
    updateLabels();
    updateModeUi();
    whenThreeReady(function bootstrapStudio3d() {
      console.log("STARTUP: Three.js engine starting");
      if (!initialized3d) {
        initThreeCore();
      } else {
        buildBody();
        renderFrame();
      }
    });

    } catch (e) {
      console.error("FATAL JS ERROR:", e);
      if (e && e.stack) console.error(e.stack);
      if (typeof logError === "function") {
        logError("FATAL: " + (e && e.message ? e.message : e));
      }
      try {
        if (window.Streamlit && typeof window.Streamlit.setComponentReady === "function") {
          window.Streamlit.setComponentReady();
          console.log("STARTUP: setComponentReady called (fatal catch)");
        }
      } catch (e2) {
        console.error("FATAL JS ERROR (ready fallback):", e2);
      }
    }
  })();
  </script>
</body>
</html>
