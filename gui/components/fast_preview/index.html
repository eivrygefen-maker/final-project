<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar Design Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --studio-w: 1680px;
      --studio-h: 1080px;
      --panel-w: 360px;
      --st-font: "Source Sans 3", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --st-primary: #ff4b4b;
      --st-primary-hover: #ff2b2b;
      --st-text: #31333f;
      --st-muted: #6b7280;
      --st-border: rgba(49, 51, 63, 0.2);
      --st-panel: rgba(240, 242, 246, 0.85);
      --st-radius: 0.5rem;
      --st-accent-track: #ff4b4b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --st-text: #fafafa;
        --st-muted: #9ca3af;
        --st-border: rgba(250, 250, 250, 0.15);
        --st-panel: rgba(38, 39, 48, 0.9);
      }
    }
    html, body {
      width: var(--studio-w) !important;
      height: var(--studio-h) !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      font-family: var(--st-font);
      color: var(--st-text);
      background: #1a1c24;
    }
    .main-wrapper {
      width: var(--studio-w) !important;
      height: var(--studio-h) !important;
      min-width: var(--studio-w) !important;
      min-height: var(--studio-h) !important;
      display: block !important;
      overflow: hidden !important;
    }
    #viewport {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
    }
    canvas#viewport {
      background: transparent !important;
    }
    * { box-sizing: border-box; }
    .studio {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      width: var(--studio-w);
      height: var(--studio-h);
      min-width: var(--studio-w);
      min-height: var(--studio-h);
      overflow: hidden;
    }
    .panel.panel-controls {
      flex: 0 0 var(--panel-w);
      order: 1;
      position: relative;
      width: var(--panel-w);
      max-width: var(--panel-w);
      height: var(--studio-h);
      max-height: var(--studio-h);
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 20;
      padding: 16px 18px 40px;
      margin: 0;
      border-right: 1px solid var(--st-border);
      border-radius: 0;
    }
    .panel {
      background: var(--st-panel);
      border: 1px solid var(--st-border);
      border-radius: var(--st-radius);
      padding: 16px 18px;
      color: var(--st-text);
    }
    .panel h3 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .panel .sub {
      margin: 0 0 14px;
      font-size: 0.92rem;
      color: var(--st-muted);
      line-height: 1.4;
    }
    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin: 14px 0 8px;
    }
    select, input[type="range"] {
      width: 100%;
    }
    select {
      padding: 10px 12px;
      min-height: 42px;
      border-radius: var(--st-radius);
      border: 1px solid var(--st-border);
      background-color: #f6f7fb;
      color: #1a1c24;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      appearance: auto;
      -webkit-appearance: menulist;
    }
    select option {
      background-color: #ffffff;
      color: #1a1c24;
    }
    @media (prefers-color-scheme: dark) {
      select {
        background-color: #262730;
        color: #fafafa;
        border-color: rgba(250, 250, 250, 0.2);
      }
      select option {
        background-color: #262730;
        color: #fafafa;
      }
    }
    .val {
      float: right;
      font-weight: 600;
      color: var(--st-muted);
      font-size: 0.9rem;
    }
    input[type="range"] {
      accent-color: var(--st-accent-track);
      height: 8px;
      margin: 6px 0 10px;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--st-accent-track);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--st-accent-track);
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 4px;
      background: rgba(49, 51, 63, 0.15);
    }
    .view-wrap {
      flex: 1 1 auto;
      order: 2;
      position: relative;
      width: auto;
      min-width: 0;
      height: var(--studio-h);
      min-height: var(--studio-h);
      display: block !important;
      border-radius: 0 var(--st-radius) var(--st-radius) 0;
      border: 1px solid var(--st-border);
      border-left: none;
      background: linear-gradient(165deg, #e8eaef 0%, #d4d8e0 45%, #c5cad4 100%);
      overflow: hidden;
      z-index: 1;
    }
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(0,0,0,0.45);
      color: #fff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--st-border);
    }
    button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: var(--st-radius);
      border: 1px solid var(--st-border);
      cursor: pointer;
      background: transparent;
      color: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    button.primary {
      background: var(--st-primary);
      border-color: var(--st-primary);
      color: #fff;
    }
    button.primary:hover { background: var(--st-primary-hover); border-color: var(--st-primary-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .mode-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      background: rgba(255,75,75,0.15);
      color: var(--st-primary);
      margin-bottom: 8px;
    }
    #errorPanel {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      max-height: 120px;
      overflow: auto;
      margin: 0;
      padding: 8px;
      font-size: 0.7rem;
      background: rgba(120, 0, 0, 0.88);
      color: #fff;
      border-radius: 6px;
      z-index: 10;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
  <div class="studio">
    <aside class="panel panel-controls studio-panel" id="controls">
      <h3>Design Studio</h3>
      <p class="sub">ROM/LHS parameters only — instant Three.js preview. Save &amp; Sync pushes to Gmsh/PyVista.</p>
      <div class="mode-pill" id="modeLabel">User (ROM)</div>

      <label for="shapeSelect">Shape</label>
      <select id="shapeSelect">
        <option value="Classical">Classical (Torres)</option>
        <option value="Dreadnought">Dreadnought / Acoustic</option>
        <option value="Box">Box (debug)</option>
      </select>

      <label>Length L (m) <span class="val" id="lengthVal">—</span></label>
      <input type="range" id="length" step="0.005" />

      <label>Width W (m) <span class="val" id="widthVal">—</span></label>
      <input type="range" id="width" step="0.005" />

      <label>Depth D (m) <span class="val" id="depthVal">—</span></label>
      <input type="range" id="depth" step="0.005" />

      <label>Top thickness (m) <span class="val" id="topThicknessVal">—</span></label>
      <input type="range" id="topThickness" step="0.0005" />

      <label>Soundhole radius (m) <span class="val" id="holeVal">—</span></label>
      <input type="range" id="holeRadius" step="0.001" />

      <label for="topWood">Top wood</label>
      <select id="topWood"></select>

      <label for="backWood">Back &amp; sides wood</label>
      <select id="backWood"></select>

      <div class="actions">
        <button type="button" class="primary" id="btnSave">Save &amp; Sync</button>
        <button type="button" id="btnRom">Run ROM Prediction</button>
        <button type="button" id="btnFem" style="display:none">Run Full FEM</button>
      </div>
    </aside>
    <div class="view-wrap">
      <div class="badge">Live 3D · Luthier blueprint</div>
      <canvas id="viewport"></canvas>
      <pre id="errorPanel" hidden aria-live="polite"></pre>
    </div>
    </div>
  </div>
  <!-- Local bridge + Three.js (lib/ — no external CDN; CSP-safe) -->
  <script src="./streamlit_bridge.js"></script>
  <script>
    /* Handshake runs in streamlit_bridge.js (sync). Flag for Three.js bootstrap only. */
    window.__studioHandshakeDone = true;
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three.module.js"
      }
    }
  </script>
  <script type="module" src="./lib/load-three.mjs"></script>
  <script>
  (function () {
    try {
    /* ── Streamlit bridge (./streamlit_bridge.js → Streamlit.* API) ─── */
    let eventsWired = false;
    let lastRomFp = "";
    let lastGeomFp = "";
    let lastRenderArgsFp = "";
    /** When true, applyArgs updates wood materials only (no buildBody / viewport reset). */
    let isMaterialChangeOnly = false;
    let animating = true;
    const STUDIO_W = 1680;
    const STUDIO_H = 1080;
    const PANEL_W = 360;
    /** Max soundhole radius vs min(body length, width); hole is independent unless clipped. */
    const HOLE_RADIUS_MAX_BODY_FRAC = 0.25;
    const EXTRUDE_CURVE_SEGMENTS = 32;
    const EXTRUDE_TOP_CURVE_SEGMENTS = 64;
    const HOLE_CIRCLE_SEGMENTS = 128;
    const TOP_PLATE_GAP_M = 0.0008;
    let initThreeScheduled = false;

    function forceViewportLayout() {
      console.log("STARTUP: Forcing viewport layout...");
      document.documentElement.style.width = STUDIO_W + "px";
      document.documentElement.style.height = STUDIO_H + "px";
      document.body.style.width = STUDIO_W + "px";
      document.body.style.height = STUDIO_H + "px";
      const wrapper = document.querySelector(".main-wrapper");
      if (wrapper) {
        wrapper.style.width = STUDIO_W + "px";
        wrapper.style.height = STUDIO_H + "px";
      }
      const wrap = document.querySelector(".view-wrap");
      if (wrap) {
        wrap.style.width = STUDIO_W + "px";
        wrap.style.height = STUDIO_H + "px";
      }
      const viewport = document.getElementById("viewport");
      const viewWrap = document.querySelector(".view-wrap");
      if (viewWrap) {
        viewWrap.style.flex = "1 1 auto";
        viewWrap.style.height = STUDIO_H + "px";
      }
      if (viewport) {
        viewport.style.width = "100%";
        viewport.style.height = "100%";
      }
      window.dispatchEvent(new Event("resize"));
    }

    function scheduleInitThreeCore() {
      if (initThreeScheduled || initialized3d) return;
      initThreeScheduled = true;
      function runAfterLayoutPaint() {
        forceViewportLayout();
        whenThreeReady(initThreeCore);
      }
      function afterDom() {
        requestAnimationFrame(function () {
          requestAnimationFrame(runAfterLayoutPaint);
        });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", afterDom, { once: true });
      } else {
        afterDom();
      }
    }

    function logError(msg) {
      const text = String(msg || "unknown error");
      console.error("[Design Studio]", text);
      const panel = document.getElementById("errorPanel");
      if (panel) {
        panel.hidden = false;
        panel.textContent = text.slice(0, 2000);
      }
    }

    window.onerror = function (message, _source, _line, _col, error) {
      logError(message + (error && error.stack ? "\n" + error.stack : ""));
      return false;
    };

    function threeLibsLoaded() {
      return Boolean(
        window.__threeReady &&
        window.THREE &&
        typeof window.THREE.Scene === "function" &&
        (typeof window.THREE.ArcballControls === "function" ||
          typeof window.THREE.OrbitControls === "function")
      );
    }

    function setupViewportControls() {
      controls = null;
      if (typeof window.THREE.ArcballControls === "function") {
        controls = new window.THREE.ArcballControls(camera, renderer.domElement);
        controls.enableGizmos = false;
        if (typeof controls.setGizmosVisible === "function") controls.setGizmosVisible(false);
        controls.enableAnimations = true;
        controls.dampingFactor = 25;
        controls.enablePan = true;
        controls.enableRotate = true;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        if (typeof controls.saveState === "function") controls.saveState();
        console.log("STARTUP: Using ArcballControls (GMSH-style)");
      } else if (typeof window.THREE.OrbitControls === "function") {
        controls = new window.THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enableRotate = true;
        controls.rotateSpeed = 0.85;
        controls.screenSpacePanning = true;
        controls.target.set(0, 0, 0);
        if (typeof controls.rotateLeft === "function" && typeof controls.rotateUp === "function") {
          const orbitLeft = controls.rotateLeft.bind(controls);
          const orbitUp = controls.rotateUp.bind(controls);
          controls.rotateLeft = function (angle) { orbitLeft(-angle); };
          controls.rotateUp = function (angle) { orbitUp(-angle); };
        }
        controls.update();
        console.log("STARTUP: Arcball missing, falling back to OrbitControls");
      } else {
        console.warn("STARTUP: No camera controls available");
      }
    }

    /** Run callback once Three.js globals are injected (handles late subscribe + fast load). */
    function whenThreeReady(callback) {
      if (threeLibsLoaded()) {
        callback();
        return;
      }
      window.addEventListener(
        "three-ready",
        function () {
          if (threeLibsLoaded()) callback();
          else logError("three-ready fired but THREE globals are incomplete.");
        },
        { once: true }
      );
      window.addEventListener(
        "three-error",
        function (ev) {
          const msg = (ev && ev.detail && ev.detail.message) || "Three.js module load failed.";
          logError(msg);
        },
        { once: true }
      );
    }

    function setComponentValue(value) {
      if (window.Streamlit && typeof Streamlit.setComponentValue === "function") {
        Streamlit.setComponentValue(value);
      }
    }

  /** Streamlit passes kwargs as args; ROM payload lives under args.initial */
  function normalizeArgs(raw) {
    if (!raw || typeof raw !== "object") return {};
    if (raw.initial && typeof raw.initial === "object") return raw.initial;
    return raw;
  }

    function renderArgsFingerprint(args) {
      const d = normalizeArgs(args);
      return [
        d.shape_type, d.length, d.width, d.depth,
        d.top_thickness, d.hole_radius,
        d.top_wood_id, d.back_wood_id, d.gui_mode,
        Boolean(args && args.templates),
      ].join("|");
    }

    function onRender(event) {
      let args = {};
      if (event && event.detail && event.detail.args) {
        args = event.detail.args;
      } else if (event && event.data && event.data.type === "streamlit:render") {
        args = event.data.args || {};
      }
      const rfp = renderArgsFingerprint(args);
      if (rfp === lastRenderArgsFp && initialized3d) {
        return;
      }
      lastRenderArgsFp = rfp;
      try {
        applyArgs(args);
      } catch (err) {
        logError("applyArgs: " + (err && err.message ? err.message : err));
      }
    }

    function wireStreamlitEvents() {
      if (eventsWired) return;
      eventsWired = true;
      if (window.Streamlit && Streamlit.events) {
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
      }
    }

    try {
      wireStreamlitEvents();
    } catch (err) {
      console.error("[Design Studio] bridge wiring failed:", err);
      if (err && err.stack) console.error(err.stack);
    }

    const ROM_KEYS = [
      "shape_type", "length", "width", "depth",
      "top_thickness", "hole_radius", "top_wood_id", "back_wood_id",
    ];

    function num(v, fallback) {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : fallback;
    }

  /** Per-shape ROM baselines (meters). Classic / Dreadnought (acoustic) / Box debug. */
    const SHAPE_TEMPLATE_DEFAULTS = {
      Classical: {
        length: 0.480,
        width: 0.370,
        depth: 0.100,
        top_thickness: 0.003,
        hole_radius: 0.045,
        bounds: { length: [0.35, 0.60], width: [0.20, 0.45], depth: [0.08, 0.15] },
      },
      Dreadnought: {
        length: 0.505,
        width: 0.395,
        depth: 0.115,
        top_thickness: 0.003,
        hole_radius: 0.050,
        bounds: { length: [0.45, 0.70], width: [0.30, 0.55], depth: [0.10, 0.20] },
      },
      Box: {
        length: 0.450,
        width: 0.350,
        depth: 0.090,
        top_thickness: 0.003,
        hole_radius: null,
        bounds: { length: [0.10, 1.00], width: [0.10, 0.80], depth: [0.01, 0.50] },
      },
    };
    const CLASSICAL_TEMPLATE = Object.assign(
      { shape_type: "Classical", top_wood_id: "spruce", back_wood_id: "mahogany" },
      SHAPE_TEMPLATE_DEFAULTS.Classical,
      {
        top_thickness_bounds: [0.003, 0.006],
        hole_radius_bounds: [0.035, 0.055],
      }
    );
    const ACOUSTIC_TEMPLATE = Object.assign(
      { shape_type: "Dreadnought", top_wood_id: "spruce", back_wood_id: "mahogany" },
      SHAPE_TEMPLATE_DEFAULTS.Dreadnought,
      {
        top_thickness_bounds: [0.003, 0.006],
        hole_radius_bounds: [0.035, 0.060],
      }
    );

    function resolveTemplateHoleRadii() {
      ["Classical", "Dreadnought"].forEach((key) => {
        const t = SHAPE_TEMPLATE_DEFAULTS[key];
        const preferred = t.hole_radius;
        t.hole_radius = templateHoleRadiusForShape(key, t.length, t.width, preferred);
      });
      const box = SHAPE_TEMPLATE_DEFAULTS.Box;
      box.hole_radius = templateHoleRadiusForShape("Box", box.length, box.width, null);
      CLASSICAL_TEMPLATE.hole_radius = SHAPE_TEMPLATE_DEFAULTS.Classical.hole_radius;
      ACOUSTIC_TEMPLATE.hole_radius = SHAPE_TEMPLATE_DEFAULTS.Dreadnought.hole_radius;
    }

    /* ── State (7D ROM + metadata only) ─────────────────────────────── */
    const state = {
      shape_type: CLASSICAL_TEMPLATE.shape_type,
      length: CLASSICAL_TEMPLATE.length,
      width: CLASSICAL_TEMPLATE.width,
      depth: CLASSICAL_TEMPLATE.depth,
      top_thickness: CLASSICAL_TEMPLATE.top_thickness,
      hole_radius: CLASSICAL_TEMPLATE.hole_radius,
      top_wood_id: CLASSICAL_TEMPLATE.top_wood_id,
      back_wood_id: CLASSICAL_TEMPLATE.back_wood_id,
      gui_mode: "user",
      bounds: Object.assign({}, CLASSICAL_TEMPLATE.bounds),
      top_thickness_bounds: CLASSICAL_TEMPLATE.top_thickness_bounds.slice(),
      hole_radius_bounds: CLASSICAL_TEMPLATE.hole_radius_bounds.slice(),
      wood_ids: ["spruce", "cedar", "mahogany", "rosewood", "maple"],
      wood_colors: {},
      templates: {},
      soundhole_from_neck_ratio: 0.5,
      bounds_by_shape: {},
    };

    /* Realistic tonewoods (matches gui/app.py STUDIO_WOOD_HEX) */
    const WOOD_COLORS_BUILTIN = {
      spruce: "#C19A6B",
      cedar: "#5D4037",
      maple: "#A67C52",
      mahogany: "#795548",
      rosewood: "#3F2A20",
    };
    const WOOD_MATERIAL_OPTS = {
      spruce: { color: "#C19A6B", roughness: 1.0, metalness: 0.0 },
      maple: { color: "#A67C52", roughness: 0.99, metalness: 0.0 },
    };
    state.wood_colors = Object.assign({}, WOOD_COLORS_BUILTIN, state.wood_colors);

    /* Built-in luthier loops (used if Python omits templates on later reruns) */
    const TEMPLATES_BUILTIN = {
      Classical: {
        nominal_length: 0.48,
        nominal_width: 0.37,
        loop: [
          [0.22,0.045],[0.18,0.11],[0.12,0.14],[0.06,0.13],[0,0.115],
          [-0.06,0.135],[-0.12,0.175],[-0.18,0.185],[-0.24,0.14],[-0.26,0.07],
          [-0.27,0],[-0.26,-0.07],[-0.24,-0.14],[-0.18,-0.185],[-0.12,-0.175],
          [-0.06,-0.135],[0,-0.115],[0.06,-0.13],[0.12,-0.14],[0.18,-0.11],[0.22,-0.045]
        ],
      },
      Dreadnought: {
        nominal_length: 0.505,
        nominal_width: 0.395,
        loop: [
          [0.22,0.05],[0.18,0.135],[0.12,0.155],[0.06,0.148],[0,0.14],
          [-0.06,0.165],[-0.12,0.195],[-0.19,0.205],[-0.25,0.16],[-0.27,0.08],
          [-0.275,0],[-0.27,-0.08],[-0.25,-0.16],[-0.19,-0.205],[-0.12,-0.195],
          [-0.06,-0.165],[0,-0.14],[0.06,-0.148],[0.12,-0.155],[0.18,-0.135],[0.22,-0.05]
        ],
      },
    };
    state.templates = Object.assign({}, TEMPLATES_BUILTIN, state.templates);

    let scene, camera, renderer, controls;
    let bodyGroup = null;
    let meshTopRef = null;
    let meshBackRef = null;
    let meshSidesRef = null;
    let initialized3d = false;
    /** True while a ROM range input is held — defers min/max DOM writes until release. */
    let romRangeDragging = false;
    let lastRomRangeDragId = null;
    function readDomSliderValues() {
      return {
        shape_type: document.getElementById("shapeSelect")?.value || state.shape_type,
        length: num(document.getElementById("length")?.value, state.length),
        width: num(document.getElementById("width")?.value, state.width),
        depth: num(document.getElementById("depth")?.value, state.depth),
        top_thickness: num(document.getElementById("topThickness")?.value, state.top_thickness),
        hole_radius: num(document.getElementById("holeRadius")?.value, state.hole_radius),
      };
    }

    const ROM_GEOM_KEYS = [
      "shape_type", "length", "width", "depth", "top_thickness", "hole_radius",
    ];

    function hasOwnPayloadKey(obj, key) {
      return Object.prototype.hasOwnProperty.call(obj, key) && obj[key] !== undefined && obj[key] !== null;
    }

    function acceptIncomingRomKey(key, incoming, domVal) {
      if (!hasOwnPayloadKey(incoming, key)) return false;
      return true;
    }

    function activeWoodId(key) {
      if (key === "top_wood_id") {
        return String(document.getElementById("topWood")?.value || state.top_wood_id).toLowerCase();
      }
      return String(document.getElementById("backWood")?.value || state.back_wood_id).toLowerCase();
    }

    function incomingWoodDiffers(key, data) {
      if (!hasOwnPayloadKey(data, key)) return false;
      return String(data[key]).toLowerCase() !== activeWoodId(key);
    }

    function payloadTouchesGeometry(data) {
      if (!data || typeof data !== "object") return false;
      const dom = readDomSliderValues();
      for (let i = 0; i < ROM_GEOM_KEYS.length; i++) {
        const k = ROM_GEOM_KEYS[i];
        if (!hasOwnPayloadKey(data, k)) continue;
        if (k === "shape_type") {
          if (String(data[k]) !== String(dom.shape_type)) return true;
        } else if (Math.abs(num(data[k]) - num(dom[k])) > 1e-6) {
          return true;
        }
      }
      return false;
    }

    function detectMaterialChangeOnly(data, hadTemplates) {
      if (!initialized3d || hadTemplates) return false;
      if (payloadTouchesGeometry(data)) return false;
      const topWoodChanged = incomingWoodDiffers("top_wood_id", data);
      const backWoodChanged = incomingWoodDiffers("back_wood_id", data);
      return topWoodChanged || backWoodChanged;
    }

    function applyMaterialOnlyUpdate(data) {
      const tw = document.getElementById("topWood");
      const bw = document.getElementById("backWood");
      if (incomingWoodDiffers("top_wood_id", data)) {
        state.top_wood_id = String(data.top_wood_id).toLowerCase();
        if (tw) tw.value = state.top_wood_id;
        updateTopMaterial();
      }
      if (incomingWoodDiffers("back_wood_id", data)) {
        state.back_wood_id = String(data.back_wood_id).toLowerCase();
        if (bw) bw.value = state.back_wood_id;
        updateBackMaterial();
      }
      lastRomFp = romFingerprint();
      renderFrame();
    }

    function mergeRomStateDelta(data) {
      if (!data || typeof data !== "object") return;
      const dom = readDomSliderValues();
      const domTopWood = document.getElementById("topWood")?.value || state.top_wood_id;
      const domBackWood = document.getElementById("backWood")?.value || state.back_wood_id;

      ROM_GEOM_KEYS.forEach((k) => {
        state[k] = dom[k];
      });
      state.shape_type = dom.shape_type;
      state.top_wood_id = domTopWood;
      state.back_wood_id = domBackWood;

      ROM_KEYS.forEach((k) => {
        let domVal;
        if (k === "top_wood_id") domVal = domTopWood;
        else if (k === "back_wood_id") domVal = domBackWood;
        else if (k === "shape_type") domVal = dom.shape_type;
        else domVal = dom[k];
        if (k === "top_wood_id" || k === "back_wood_id") {
          if (!incomingWoodDiffers(k, data)) return;
        }
        if (acceptIncomingRomKey(k, data, domVal)) state[k] = data[k];
      });

      if (data.gui_mode) state.gui_mode = data.gui_mode;
      if (data.bounds) state.bounds = data.bounds;
      if (data.bounds_by_shape) state.bounds_by_shape = data.bounds_by_shape;
      if (data.top_thickness_bounds) state.top_thickness_bounds = data.top_thickness_bounds;
      if (data.hole_radius_bounds) state.hole_radius_bounds = data.hole_radius_bounds;
      if (data.wood_ids) state.wood_ids = data.wood_ids;
      if (data.wood_colors) state.wood_colors = Object.assign({}, WOOD_COLORS_BUILTIN, data.wood_colors);
      if (data.templates && typeof data.templates === "object") {
        state.templates = Object.assign({}, state.templates, data.templates);
      }
      if (data.soundhole_from_neck_ratio != null) {
        state.soundhole_from_neck_ratio = num(data.soundhole_from_neck_ratio, 0.5);
      }
    }

    function romFingerprint() {
      return [
        state.shape_type,
        num(state.length, 0), num(state.width, 0), num(state.depth, 0),
        num(state.top_thickness, 0), num(state.hole_radius, 0),
        state.top_wood_id, state.back_wood_id,
      ].join("|");
    }

    function geometryFingerprint() {
      return [
        state.shape_type,
        num(state.length, 0), num(state.width, 0), num(state.depth, 0),
        num(state.top_thickness, 0), num(state.hole_radius, 0),
      ].join("|");
    }

    function ringSignedArea(pts) {
      let area = 0;
      for (let i = 0, n = pts.length; i < n; i++) {
        const j = (i + 1) % n;
        area += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
      }
      return area * 0.5;
    }

    function soundholeShapeXY(outlinePts) {
      let minX = Infinity;
      let maxX = -Infinity;
      for (let i = 0; i < outlinePts.length; i++) {
        const x = outlinePts[i][0];
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
      }
      const ratio = num(state.soundhole_from_neck_ratio, 0.5);
      // Blueprint loop: neck at +X; hole position measured from neck along length.
      const hx = maxX - ratio * (maxX - minX);
      return [hx, 0];
    }

    function makeOutlineShape(pts, holeRadius, cutHole, holeXY) {
      const shape = new THREE.Shape();
      shape.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
      shape.closePath();
      const hr = num(holeRadius, 0);
      if (cutHole && hr > 0.005) {
        const hx = holeXY ? holeXY[0] : 0;
        const hy = holeXY ? holeXY[1] : 0;
        const holePath = new THREE.Path();
        let holeClockwise = true;
        if (THREE.ShapeUtils && typeof THREE.ShapeUtils.isClockWise === "function") {
          const contour = pts.map(([x, y]) => new THREE.Vector2(x, y));
          holeClockwise = !THREE.ShapeUtils.isClockWise(contour);
        } else {
          holeClockwise = ringSignedArea(pts) > 0;
        }
        for (let i = 0; i <= HOLE_CIRCLE_SEGMENTS; i++) {
          const t = (2 * Math.PI * i) / HOLE_CIRCLE_SEGMENTS;
          const angle = holeClockwise ? (2 * Math.PI - t) : t;
          const x = hx + hr * Math.cos(angle);
          const y = hy + hr * Math.sin(angle);
          if (i === 0) holePath.moveTo(x, y);
          else holePath.lineTo(x, y);
        }
        shape.holes.push(holePath);
      }
      return shape;
    }

    function boxOutlinePts(L, W) {
      const halfL = num(L, 0.49) / 2;
      const halfW = num(W, 0.37) / 2;
      return [
        [-halfL, -halfW], [halfL, -halfW], [halfL, halfW], [-halfL, halfW],
      ];
    }

    function woodMaterialOpts(woodId) {
      const key = String(woodId || "").toLowerCase();
      return WOOD_MATERIAL_OPTS[key] || null;
    }

    function resolveWoodSurfaceColor(woodId, mesh) {
      const key = String(woodId || "").toLowerCase();
      const opts = woodMaterialOpts(woodId);
      const base = opts ? hexColor(opts.color) : woodColorHex(woodId);
      if (key !== "maple") return base;
      const tint = mesh === meshBackRef ? 0.88 : (mesh === meshSidesRef ? 0.84 : 0.92);
      return base.clone().multiplyScalar(tint);
    }

    function createWoodMaterial(woodId) {
      const opts = woodMaterialOpts(woodId);
      return new THREE.MeshStandardMaterial({
        color: resolveWoodSurfaceColor(woodId, null),
        roughness: opts ? opts.roughness : 1.0,
        metalness: opts ? opts.metalness : 0.0,
        flatShading: false,
      });
    }

    function materialsForExtrudeGeometry(geom, woodId) {
      const base = createWoodMaterial(woodId);
      const groupCount = geom && geom.groups && geom.groups.length > 0 ? geom.groups.length : 1;
      if (groupCount <= 1) return base;
      return Array.from({ length: groupCount }, () => base.clone());
    }

    function applyWoodMaterialToMesh(mesh, woodId) {
      if (!mesh) return;
      const opts = woodMaterialOpts(woodId);
      const color = resolveWoodSurfaceColor(woodId, mesh);
      const applyOne = function (mat) {
        if (!mat) return;
        mat.color.copy(color);
        mat.roughness = opts ? opts.roughness : 1.0;
        mat.metalness = opts ? opts.metalness : 0.0;
        if (mat.emissive) mat.emissive.set(0, 0, 0);
        mat.needsUpdate = true;
      };
      if (Array.isArray(mesh.material)) {
        mesh.material.forEach(applyOne);
      } else if (mesh.material) {
        applyOne(mesh.material);
      } else {
        mesh.material = materialsForExtrudeGeometry(mesh.geometry, woodId);
      }
    }

    function updateTopMaterial() {
      if (!meshTopRef) return;
      applyWoodMaterialToMesh(meshTopRef, state.top_wood_id);
    }

    function updateBackMaterial() {
      const woodId = String(state.back_wood_id || "mahogany").toLowerCase();
      applyWoodMaterialToMesh(meshBackRef, woodId);
      applyWoodMaterialToMesh(meshSidesRef, woodId);
    }

    function holeRadiusCap(L, W) {
      const span = Math.min(num(L, 0.49), num(W, 0.37));
      return Math.max(span * HOLE_RADIUS_MAX_BODY_FRAC, 0.01);
    }

    function softLimitHoleRadius(L, W, hr) {
      const cap = holeRadiusCap(L, W);
      return Math.min(num(hr, 0.045), cap - 1e-5);
    }

    /** Clip hole only when body shrinks below current radius (independent control otherwise). */
    function clipHoleRadiusIfExceedsMax(L, W, hr) {
      const cap = holeRadiusCap(L, W);
      const v = num(hr, 0.045);
      if (v > cap - 1e-5) return cap - 1e-5;
      return v;
    }

    function assignRangeAtomic(el, min, max, value) {
      if (!el) return num(value, min);
      const lo = num(min, 0);
      const hi = num(max, lo);
      const v = Math.min(hi, Math.max(lo, num(value, lo)));
      el.min = String(lo);
      el.max = String(hi);
      el.value = String(v);
      return v;
    }

    function syncHoleSliderAtomic(requestedHr, opts) {
      const hEl = document.getElementById("holeRadius");
      const hrFallback = [0.035, 0.055];
      const hrB = normalizeSliderBounds(state.hole_radius_bounds, hrFallback, 0.001);
      let lo = hrB[0];
      let hi = Math.min(hrB[1], holeRadiusCap(state.length, state.width));
      const hrIn = requestedHr != null ? requestedHr : state.hole_radius;
      const clipped = opts && opts.clipOnly
        ? clipHoleRadiusIfExceedsMax(state.length, state.width, hrIn)
        : softLimitHoleRadius(state.length, state.width, hrIn);
      if (!hEl) {
        state.hole_radius = clipped;
        return clipped;
      }
      if (!hEl.step) hEl.step = "0.001";
      state.hole_radius = assignRangeAtomic(hEl, lo, hi, clipped);
      return state.hole_radius;
    }

    function syncRomSlidersAtomically(opts) {
      const b = state.bounds || {};
      const lenEl = document.getElementById("length");
      const wEl = document.getElementById("width");
      const dEl = document.getElementById("depth");
      const tEl = document.getElementById("topThickness");
      const lenPair = normalizeSliderBounds(b.length || [0.35, 0.6], [0.35, 0.6], 0.001);
      const wPair = normalizeSliderBounds(b.width || [0.2, 0.45], [0.2, 0.45], 0.001);
      const dPair = normalizeSliderBounds(b.depth || [0.08, 0.15], [0.08, 0.15], 0.001);
      const tt = normalizeSliderBounds(state.top_thickness_bounds, [0.003, 0.006], 0.0005);
      state.length = assignRangeAtomic(lenEl, lenPair[0], lenPair[1], state.length);
      state.width = assignRangeAtomic(wEl, wPair[0], wPair[1], state.width);
      state.depth = assignRangeAtomic(dEl, dPair[0], dPair[1], state.depth);
      state.top_thickness = assignRangeAtomic(tEl, tt[0], tt[1], state.top_thickness);
      if (opts && opts.skipHole) return;
      if (opts && opts.holeClipOnly) {
        state.hole_radius = syncHoleSliderAtomic(state.hole_radius, { clipOnly: true });
      } else {
        state.hole_radius = syncHoleSliderAtomic(state.hole_radius);
      }
    }

    function insetLoop(pts, frac) {
      let cx = 0;
      let cy = 0;
      const n = pts.length;
      for (let i = 0; i < n; i++) {
        cx += pts[i][0];
        cy += pts[i][1];
      }
      cx /= n;
      cy /= n;
      return pts.map(([x, y]) => [cx + (x - cx) * frac, cy + (y - cy) * frac]);
    }

    function appendLoopToPath(path, pts, reverse) {
      const order = reverse ? pts.slice().reverse() : pts;
      for (let i = 0; i < order.length; i++) {
        const x = order[i][0];
        const y = order[i][1];
        if (i === 0) path.moveTo(x, y);
        else path.lineTo(x, y);
      }
      path.closePath();
    }

    function makeSidesShape(outerPts, insetFrac) {
      const innerPts = insetLoop(outerPts, insetFrac);
      const shape = new THREE.Shape();
      appendLoopToPath(shape, outerPts, false);
      const rimHole = new THREE.Path();
      let innerClockwise = true;
      if (THREE.ShapeUtils && typeof THREE.ShapeUtils.isClockWise === "function") {
        const innerContour = innerPts.map(([x, y]) => new THREE.Vector2(x, y));
        innerClockwise = THREE.ShapeUtils.isClockWise(innerContour);
      } else {
        innerClockwise = ringSignedArea(innerPts) > 0;
      }
      appendLoopToPath(rimHole, innerPts, innerClockwise);
      shape.holes.push(rimHole);
      return shape;
    }

    function setupStudioLighting() {
      scene.add(new THREE.AmbientLight(0xffffff, 0.58));
      const hemi = new THREE.HemisphereLight(0xf4f6fa, 0x8a9199, 0.52);
      hemi.position.set(0, 0.85, 0);
      scene.add(hemi);

      const topKey = new THREE.DirectionalLight(0xffffff, 0.46);
      topKey.position.set(0.35, 1.55, 0.75);
      scene.add(topKey);

      const bottomFill = new THREE.DirectionalLight(0xfff0dc, 0.58);
      bottomFill.position.set(0.15, -1.05, -0.55);
      scene.add(bottomFill);

      const frontRim = new THREE.DirectionalLight(0xffffff, 0.38);
      frontRim.position.set(0.05, 0.55, 1.25);
      scene.add(frontRim);

      const backRim = new THREE.DirectionalLight(0xffffff, 0.42);
      backRim.position.set(-0.05, 0.45, -1.25);
      scene.add(backRim);

      const sideLeft = new THREE.DirectionalLight(0xffffff, 0.22);
      sideLeft.position.set(-1.15, 0.25, 0.15);
      scene.add(sideLeft);

      const sideRight = new THREE.DirectionalLight(0xffffff, 0.22);
      sideRight.position.set(1.15, 0.25, 0.15);
      scene.add(sideRight);
    }

    function scaleLoop(loop, L, W, nominalLength, nominalWidth) {
      const sx = num(L, 0.49) / Math.max(num(nominalLength, 0.49), 1e-9);
      const sy = num(W, 0.37) / Math.max(num(nominalWidth, 0.37), 1e-9);
      return loop.map(([x, y]) => [x * sx, y * sy]);
    }

  function woodColorHex(woodId) {
    const key = String(woodId || "").toLowerCase();
    const hex = state.wood_colors && state.wood_colors[key];
    return hexColor(hex || WOOD_COLORS_BUILTIN[key] || "#8B7355");
  }

  function hexColor(hex) {
    const h = String(hex || "#8B7355").replace("#", "");
    if (h.length !== 6) return new THREE.Color(0.55, 0.45, 0.35);
    return new THREE.Color(
      parseInt(h.slice(0, 2), 16) / 255,
      parseInt(h.slice(2, 4), 16) / 255,
      parseInt(h.slice(4, 6), 16) / 255
    );
  }

    function disposeGroup(g) {
      if (!g) return;
      g.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
          else obj.material.dispose();
        }
      });
      if (g.parent) g.parent.remove(g);
    }

    function resolveOutlinePts(L, W) {
      if (state.shape_type === "Box") {
        return boxOutlinePts(L, W);
      }
      const tmpl = state.templates[state.shape_type] || state.templates.Classical;
      if (!tmpl || !tmpl.loop || tmpl.loop.length < 3) {
        return boxOutlinePts(L, W);
      }
      return scaleLoop(tmpl.loop, L, W, tmpl.nominal_length, tmpl.nominal_width);
    }

    function buildBody() {
      if (typeof THREE === "undefined" || !scene) return;
      disposeGroup(bodyGroup);
      meshTopRef = null;
      meshBackRef = null;
      meshSidesRef = null;
      bodyGroup = new THREE.Group();
      const L = num(state.length, 0.49);
      const W = num(state.width, 0.37);
      const D = num(state.depth, 0.095);
      const tTop = Math.min(num(state.top_thickness, 0.0045), D * 0.45);
      const hr = softLimitHoleRadius(L, W, state.hole_radius);
      state.hole_radius = hr;
      const outlinePts = resolveOutlinePts(L, W);
      const holeXY = soundholeShapeXY(outlinePts);
      const rimInset = Math.max(0.82, Math.min(0.97, 1 - (2.2 * tTop) / Math.max(W, L, 1e-6)));
      const sideDepth = Math.max(D - 2 * tTop, tTop * 0.5);
      const extrudePlate = {
        depth: tTop,
        bevelEnabled: false,
        curveSegments: EXTRUDE_TOP_CURVE_SEGMENTS,
      };
      const extrudeSides = {
        depth: sideDepth,
        bevelEnabled: false,
        curveSegments: EXTRUDE_CURVE_SEGMENTS,
      };

      function orientPlate(geom, yBase) {
        geom.rotateX(-Math.PI / 2);
        geom.translate(0, yBase, 0);
      }

      const shapeBack = makeOutlineShape(outlinePts, hr, false, null);
      const geomBack = new THREE.ExtrudeGeometry(shapeBack, extrudePlate);
      orientPlate(geomBack, 0);
      const meshBack = new THREE.Mesh(geomBack, materialsForExtrudeGeometry(geomBack, state.back_wood_id));
      meshBack.name = "back";
      meshBack.renderOrder = 0;
      meshBackRef = meshBack;
      bodyGroup.add(meshBack);

      const shapeSides = makeSidesShape(outlinePts, rimInset);
      const geomSides = new THREE.ExtrudeGeometry(shapeSides, extrudeSides);
      orientPlate(geomSides, tTop);
      const meshSides = new THREE.Mesh(geomSides, materialsForExtrudeGeometry(geomSides, state.back_wood_id));
      meshSides.name = "sides";
      meshSides.renderOrder = 0;
      meshSidesRef = meshSides;
      bodyGroup.add(meshSides);

      const shapeTop = makeOutlineShape(outlinePts, hr, true, holeXY);
      const geomTop = new THREE.ExtrudeGeometry(shapeTop, extrudePlate);
      orientPlate(geomTop, D - tTop + TOP_PLATE_GAP_M);
      const meshTop = new THREE.Mesh(geomTop, materialsForExtrudeGeometry(geomTop, state.top_wood_id));
      meshTop.name = "top";
      meshTop.renderOrder = 1;
      meshTopRef = meshTop;
      bodyGroup.add(meshTop);

      const box = new THREE.Box3().setFromObject(bodyGroup);
      const center = box.getCenter(new THREE.Vector3());
      bodyGroup.position.sub(center);
      scene.add(bodyGroup);
      frameOrbitTargetOnBody();
      console.log(
        "DIAGNOSTIC: bodyGroup mesh count =",
        bodyGroup.children.length,
        "| center offset =",
        center.x.toFixed(4),
        center.y.toFixed(4),
        center.z.toFixed(4)
      );
      renderFrame();
    }

    function frameOrbitTargetOnBody() {
      if (!bodyGroup || !controls || !controls.target) return;
      bodyGroup.updateMatrixWorld(true);
      const pivotBox = new THREE.Box3().setFromObject(bodyGroup);
      const pivot = pivotBox.getCenter(new THREE.Vector3());
      controls.target.copy(pivot);
      if (typeof controls.update === "function") controls.update();
    }

    function renderFrame() {
      if (!renderer || !scene || !camera) return;
      try {
        if (!window.didLogCamera) {
          const target = controls && controls.target ? controls.target : null;
          console.log(
            "DIAGNOSTIC: Camera Position =",
            { x: camera.position.x, y: camera.position.y, z: camera.position.z },
            "Target =",
            target ? { x: target.x, y: target.y, z: target.z } : "n/a"
          );
          window.didLogCamera = true;
        }
        if (controls) controls.update();
        renderer.render(scene, camera);
      } catch (err) {
        console.error("[Design Studio] renderFrame:", err);
      }
    }

    function signalReadyAfterCrash(checkpoint) {
      console.error("DEBUG CRASH AT CHECKPOINT " + checkpoint);
      try {
        if (window.Streamlit && typeof window.Streamlit.setComponentReady === "function") {
          window.Streamlit.setComponentReady();
          console.log("STARTUP: setComponentReady called (post-crash checkpoint " + checkpoint + ")");
        }
      } catch (readyErr) {
        console.error("DEBUG: setComponentReady failed after crash:", readyErr);
      }
    }

    /**
     * Synchronous Three.js boot (no await / GLTF / texture loaders).
     * Geometry build is deferred to the next task so the mount handshake is not blocked.
     */
    function initThreeCore() {
      if (initialized3d) return;
      forceViewportLayout();
      var checkpoint = 0;
      try {
        const canvas = document.getElementById("viewport");
        if (!canvas) throw new Error("viewport canvas not found");
        const wrap = canvas.parentElement;
        const viewWrapEl = document.querySelector(".view-wrap");
        const w = viewWrapEl && viewWrapEl.clientWidth > 0 ? viewWrapEl.clientWidth : (STUDIO_W - PANEL_W);
        const h = STUDIO_H;
        canvas.width = w;
        canvas.height = h;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        console.log(
          "DEBUG: #viewport size:",
          canvas.clientWidth + "x" + canvas.clientHeight,
          "| buffer:",
          canvas.width + "x" + canvas.height,
          "| wrap:",
          wrap ? wrap.clientWidth + "x" + wrap.clientHeight : "n/a"
        );

        checkpoint = 3;
        console.log("CHECKPOINT 3: Scene setup");
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe8eaef);

        checkpoint = 2;
        console.log("CHECKPOINT 2: Camera setup");
        camera = new THREE.PerspectiveCamera(42, w / h, 0.01, 10);
        camera.position.set(0.36, 0.28, 0.46);

        checkpoint = 1;
        console.log("CHECKPOINT 1: Renderer setup");
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        setupViewportControls();

        setupStudioLighting();

        checkpoint = 4;
        console.log("CHECKPOINT 4: Loading geometry...");
        setTimeout(function () {
          var geoCheckpoint = 4;
          try {
            readSliders();
            lastGeomFp = geometryFingerprint();
            lastRomFp = romFingerprint();
            buildBody();
            geoCheckpoint = 5;
            console.log("CHECKPOINT 5: Geometry loaded");
            renderFrame();
            initialized3d = true;
            animate();
            geoCheckpoint = 6;
            console.log("CHECKPOINT 6: Engine fully initialized");
          } catch (geoErr) {
            console.error("DEBUG CRASH AT CHECKPOINT " + geoCheckpoint, geoErr);
            if (geoErr && geoErr.stack) console.error(geoErr.stack);
            signalReadyAfterCrash(geoCheckpoint);
          }
        }, 0);
      } catch (error) {
        console.error("DEBUG CRASH AT CHECKPOINT " + checkpoint, error);
        if (error && error.stack) console.error(error.stack);
        signalReadyAfterCrash(checkpoint);
      }
    }

    function initThree() {
      if (initialized3d) return;
      scheduleInitThreeCore();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!animating) return;
      try {
        if (controls) controls.update();
        if (renderer && scene && camera) renderer.render(scene, camera);
      } catch (err) {
        logError("render loop: " + (err && err.message ? err.message : err));
        animating = false;
      }
    }

    document.addEventListener("visibilitychange", function () {
      animating = !document.hidden;
      if (animating && initialized3d) animate();
    });

    function onResize() {
      if (!renderer || !camera) return;
      const viewWrapEl = document.querySelector(".view-wrap");
      const w = viewWrapEl && viewWrapEl.clientWidth > 0 ? viewWrapEl.clientWidth : (STUDIO_W - PANEL_W);
      const h = STUDIO_H;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    /* Resize listener disabled — fixed studio layout; avoids zero-height collapse */

    function fmt(v, dec) {
      return num(v, 0).toFixed(dec);
    }

    function normalizeSliderBounds(pair, fallback, minSpan) {
      const fb = fallback || [0, 1];
      const spanMin = Math.max(num(minSpan, 0), 1e-4);
      let lo = num(pair && pair[0], fb[0]);
      let hi = num(pair && pair[1], fb[1]);
      if (!Number.isFinite(lo)) lo = fb[0];
      if (!Number.isFinite(hi)) hi = fb[1];
      if (lo > hi) {
        const t = lo;
        lo = hi;
        hi = t;
      }
      if (hi - lo < spanMin) {
        const mid = 0.5 * (lo + hi);
        lo = mid - 0.5 * spanMin;
        hi = mid + 0.5 * spanMin;
      }
      return [lo, hi];
    }

    function templateHoleRadiusForShape(shapeKey, length, width, templateHole) {
      const L = num(length, 0.48);
      const W = num(width, 0.37);
      if (shapeKey === "Box") {
        const ratioHole = HOLE_RADIUS_MAX_BODY_FRAC * W;
        return softLimitHoleRadius(L, W, ratioHole);
      }
      return softLimitHoleRadius(L, W, num(templateHole, 0.045));
    }

    function applyShapeTemplateToDom(shapeType) {
      const key = SHAPE_TEMPLATE_DEFAULTS[shapeType]
        ? shapeType
        : "Classical";
      const tmpl = SHAPE_TEMPLATE_DEFAULTS[key];
      state.shape_type = key;
      state.length = tmpl.length;
      state.width = tmpl.width;
      state.depth = tmpl.depth;
      state.top_thickness = tmpl.top_thickness;
      const byShape = state.bounds_by_shape || {};
      state.bounds = byShape[key]
        ? Object.assign({}, byShape[key])
        : Object.assign({}, tmpl.bounds);
      state.hole_radius = templateHoleRadiusForShape(
        key,
        state.length,
        state.width,
        tmpl.hole_radius
      );
      if (key === "Classical") {
        state.top_wood_id = CLASSICAL_TEMPLATE.top_wood_id;
        state.back_wood_id = CLASSICAL_TEMPLATE.back_wood_id;
      } else if (key === "Dreadnought") {
        state.top_wood_id = ACOUSTIC_TEMPLATE.top_wood_id;
        state.back_wood_id = ACOUSTIC_TEMPLATE.back_wood_id;
      }
      const shapeEl = document.getElementById("shapeSelect");
      if (shapeEl) shapeEl.value = key;
      syncRomSlidersAtomically();
      const top = document.getElementById("topWood");
      const back = document.getElementById("backWood");
      if (top) top.value = state.top_wood_id;
      if (back) back.value = state.back_wood_id;
      updateLabels();
      lastGeomFp = "";
      if (initialized3d) {
        updateTopMaterial();
        updateBackMaterial();
        sync3dFromState(true);
        frameOrbitTargetOnBody();
      }
    }

    function applyClassicalBaselineToDom() {
      fillWoodSelects();
      applyShapeTemplateToDom("Classical");
    }

    function applySliderBounds() {
      syncRomSlidersAtomically();
    }

    function readRomStateFromDom(opts) {
      const prevHr = num(state.hole_radius, 0.045);
      const newL = num(document.getElementById("length").value, state.length);
      const newW = num(document.getElementById("width").value, state.width);
      const preserveHole = Boolean(opts && opts.preserveHoleRadius);
      state.shape_type = document.getElementById("shapeSelect").value || "Classical";
      state.length = newL;
      state.width = newW;
      state.depth = num(document.getElementById("depth").value, state.depth);
      state.top_thickness = num(document.getElementById("topThickness").value, state.top_thickness);
      if (preserveHole) {
        state.hole_radius = clipHoleRadiusIfExceedsMax(newL, newW, prevHr);
      } else {
        state.hole_radius = softLimitHoleRadius(
          newL,
          newW,
          document.getElementById("holeRadius").value
        );
      }
      state.top_wood_id = document.getElementById("topWood").value || "spruce";
      state.back_wood_id = document.getElementById("backWood").value || "mahogany";
    }

    function readSliders() {
      readRomStateFromDom();
      syncRomSlidersAtomically();
      updateLabels();
    }

  function updateLabels() {
    document.getElementById("lengthVal").textContent = fmt(state.length, 3);
    document.getElementById("widthVal").textContent = fmt(state.width, 3);
    document.getElementById("depthVal").textContent = fmt(state.depth, 3);
    document.getElementById("topThicknessVal").textContent = fmt(state.top_thickness, 4);
    document.getElementById("holeVal").textContent = fmt(state.hole_radius, 3);
  }

  function updateModeUi() {
    const admin = state.gui_mode === "admin";
    document.getElementById("modeLabel").textContent = admin ? "Admin (FEM)" : "User (ROM)";
    document.getElementById("btnRom").style.display = admin ? "none" : "block";
    document.getElementById("btnFem").style.display = admin ? "block" : "none";
  }

    function payload(action) {
      return {
        action,
        _ts: Date.now(),
        shape_type: state.shape_type,
        length: num(state.length, 0.49),
        width: num(state.width, 0.37),
        depth: num(state.depth, 0.095),
        top_thickness: num(state.top_thickness, 0.0045),
        hole_radius: num(state.hole_radius, 0.045),
        top_wood_id: state.top_wood_id,
        back_wood_id: state.back_wood_id,
        gui_mode: state.gui_mode,
      };
    }

    function sync3dFromState(skipDomRead) {
      try {
        if (!skipDomRead) readSliders();
        if (!initialized3d) {
          initThree();
          return;
        }
        const gfp = geometryFingerprint();
        if (gfp === lastGeomFp) {
          renderFrame();
          return;
        }
        lastGeomFp = gfp;
        buildBody();
      } catch (err) {
        console.error("[Design Studio] sync3dFromState:", err);
      }
    }

    function preview3dFromSliders() {
      const dragId = romRangeDragging
        ? lastRomRangeDragId
        : (document.activeElement && document.activeElement.id);
      const bodyDrag = dragId === "length" || dragId === "width";
      readRomStateFromDom({ preserveHoleRadius: bodyDrag });
      if (romRangeDragging) {
        if (bodyDrag) {
          syncRomSlidersAtomically({ holeClipOnly: true });
        } else if (dragId === "holeRadius") {
          syncRomSlidersAtomically();
        } else {
          syncRomSlidersAtomically({ skipHole: true });
        }
      } else {
        syncRomSlidersAtomically();
      }
      updateLabels();
      sync3dFromState(true);
    }

    function endRomRangeDrag() {
      if (!romRangeDragging) return;
      const releasedId = lastRomRangeDragId;
      romRangeDragging = false;
      lastRomRangeDragId = null;
      readSliders();
      sync3dFromState(true);
      if (releasedId === "length" || releasedId === "width") {
        frameOrbitTargetOnBody();
      }
    }

  function fillWoodSelects() {
    const top = document.getElementById("topWood");
    const back = document.getElementById("backWood");
    const ids = state.wood_ids || [];
    if (top.options.length === ids.length && ids.length > 0) {
      if (top.value !== state.top_wood_id) top.value = state.top_wood_id;
      if (back.value !== state.back_wood_id) back.value = state.back_wood_id;
      return;
    }
    top.innerHTML = "";
    back.innerHTML = "";
    ids.forEach((id) => {
      const o1 = document.createElement("option");
      o1.value = id;
      o1.textContent = id.charAt(0).toUpperCase() + id.slice(1);
      top.appendChild(o1);
      const o2 = o1.cloneNode(true);
      back.appendChild(o2);
    });
    top.value = state.top_wood_id;
    back.value = state.back_wood_id;
  }

    function applyArgs(rawArgs) {
      const data = normalizeArgs(rawArgs);
      const hadTemplates = Boolean(data.templates && Object.keys(data.templates).length);
      isMaterialChangeOnly = detectMaterialChangeOnly(data, hadTemplates);
      if (isMaterialChangeOnly) {
        if (data.gui_mode) state.gui_mode = data.gui_mode;
        if (data.wood_colors) state.wood_colors = Object.assign({}, WOOD_COLORS_BUILTIN, data.wood_colors);
        applyMaterialOnlyUpdate(data);
        isMaterialChangeOnly = false;
        return;
      }
      isMaterialChangeOnly = false;
      const prevRomFp = lastRomFp;
      mergeRomStateDelta(data);
      if (!state.bounds && state.bounds_by_shape && state.bounds_by_shape[state.shape_type]) {
        state.bounds = state.bounds_by_shape[state.shape_type];
      }
      if (hasOwnPayloadKey(data, "shape_type")) {
        const shapeEl = document.getElementById("shapeSelect");
        if (shapeEl && shapeEl.value !== state.shape_type) shapeEl.value = state.shape_type;
      }
      fillWoodSelects();
      ROM_GEOM_KEYS.forEach((key) => {
        if (hasOwnPayloadKey(data, key)) state[key] = data[key];
      });
      state.hole_radius = softLimitHoleRadius(
        state.length,
        state.width,
        state.hole_radius
      );
      syncRomSlidersAtomically();
      const tw = document.getElementById("topWood");
      const bw = document.getElementById("backWood");
      const topWoodChanged = incomingWoodDiffers("top_wood_id", data);
      const backWoodChanged = incomingWoodDiffers("back_wood_id", data);
      if (topWoodChanged) {
        state.top_wood_id = String(data.top_wood_id).toLowerCase();
        if (tw) tw.value = state.top_wood_id;
      }
      if (backWoodChanged) {
        state.back_wood_id = String(data.back_wood_id).toLowerCase();
        if (bw) bw.value = state.back_wood_id;
      }
      updateLabels();
      updateModeUi();
      const romFp = romFingerprint();
      const geomFp = geometryFingerprint();
      if (geomFp !== lastGeomFp || hadTemplates || !initialized3d) {
        lastGeomFp = geomFp;
        lastRomFp = romFp;
        sync3dFromState();
        if (topWoodChanged) updateTopMaterial();
        if (backWoodChanged) updateBackMaterial();
      } else {
        lastRomFp = romFp;
        if (topWoodChanged) updateTopMaterial();
        if (backWoodChanged) updateBackMaterial();
        if (topWoodChanged || backWoodChanged) renderFrame();
      }
      if (hasOwnPayloadKey(data, "hole_radius")) {
        syncHoleSliderAtomic(state.hole_radius);
      }
    }

    ["length", "width", "depth", "topThickness", "holeRadius"].forEach((id) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("pointerdown", function () {
        romRangeDragging = true;
        lastRomRangeDragId = id;
      });
      el.addEventListener("input", preview3dFromSliders);
    });
    document.addEventListener("pointerup", endRomRangeDrag);
    document.addEventListener("pointercancel", endRomRangeDrag);
    document.addEventListener("mouseup", endRomRangeDrag);
    document.getElementById("shapeSelect").addEventListener("change", () => {
      const shapeType = document.getElementById("shapeSelect").value || "Classical";
      applyShapeTemplateToDom(shapeType);
    });

    document.getElementById("topWood").addEventListener("change", function () {
      state.top_wood_id = document.getElementById("topWood").value || "spruce";
      updateTopMaterial();
      renderFrame();
    });
    document.getElementById("backWood").addEventListener("change", function () {
      state.back_wood_id = document.getElementById("backWood").value || "mahogany";
      updateBackMaterial();
      renderFrame();
    });

    document.getElementById("btnSave").addEventListener("click", () => {
      readSliders();
      setComponentValue(payload("save_sync"));
    });
    document.getElementById("btnRom").addEventListener("click", () => {
      readSliders();
      setComponentValue(payload("run_rom"));
    });
    document.getElementById("btnFem").addEventListener("click", () => {
      readSliders();
      setComponentValue(payload("run_fem"));
    });

    resolveTemplateHoleRadii();
    applyClassicalBaselineToDom();
    updateModeUi();
    scheduleInitThreeCore();

    } catch (e) {
      console.error("FATAL JS ERROR:", e);
      if (e && e.stack) console.error(e.stack);
      if (typeof logError === "function") {
        logError("FATAL: " + (e && e.message ? e.message : e));
      }
      try {
        if (window.Streamlit && typeof window.Streamlit.setComponentReady === "function") {
          window.Streamlit.setComponentReady();
          console.log("STARTUP: setComponentReady called (fatal catch)");
        }
      } catch (e2) {
        console.error("FATAL JS ERROR (ready fallback):", e2);
      }
    }
  })();
  </script>
</body>
</html>
